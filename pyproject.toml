[project]
name = "tldb"
version = "2.0.0"
description = "Base de timelines historiques : validation, requêtes et build du site"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["tldb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
