<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idées — prototype</title>
<style>
:root{
  --paper:#f6f3ec; --paper2:#efeadf; --card:#fffdf8; --ink:#1f1c18; --muted:#6d675c; --faint:#a59e90;
  --rule:#ddd5c5; --accent:#b3261e; --focus:#1f4e8c; --sugg:#7c6f57;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:270px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--paper2)}
.brand{font:600 17px/1 var(--serif);white-space:nowrap}
.brand small{font:12px var(--sans);color:var(--muted);margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:1px solid transparent;background:none;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--muted)}
nav button:hover{color:var(--ink);border-color:var(--rule)}
nav button.on{background:var(--ink);color:var(--paper)}
nav button .n{font-size:11px;opacity:.6;margin-right:5px}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#side{border-right:1px solid var(--rule);overflow:auto;padding:10px 12px 24px;background:var(--paper)}
#side h3{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
#side h3:first-child{margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
.legend{display:grid;grid-template-columns:18px 1fr;gap:3px 6px;align-items:center;font-size:12.5px}
.legend svg{display:block}
.tr-row{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:1px 0;cursor:pointer;user-select:none}
.tr-row.off{opacity:.35}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.integ{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:8px 10px;font-size:12.5px}
.integ div{display:grid;grid-template-columns:22px 82px 1fr;gap:4px;padding:3px 0;border-top:1px dashed var(--rule);align-items:baseline}
.integ div:first-child{border-top:0}
.integ .v{font-weight:700;text-align:center}
.v.y{color:#2e6f40}.v.m{color:#b8901a}.v.n{color:#a33}
.bridge{padding:5px 0;border-top:1px dashed var(--rule);cursor:pointer;font-size:13px}
.bridge:hover{color:var(--focus)}
.bridge .m{font-size:11.5px;color:var(--muted)}
#stage{position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.axis{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
svg text{font-family:var(--sans)}
.lbl{font-size:11px;fill:var(--ink)}
.lblm{font-size:10.5px;fill:var(--muted)}
.gut{font-size:12.5px;fill:var(--ink);cursor:pointer}
.gut:hover{fill:var(--focus)}
#sv2 .gut{paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.grp{font:600 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
.hot{cursor:pointer}
#v1 .scroll{cursor:grab}
#v1 .scroll.drag{cursor:grabbing}
#tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;box-shadow:0 6px 20px #0002;max-width:340px;font-size:12.5px;display:none;z-index:50}
#tip b{font-family:var(--serif);font-size:14px}
#tip .m{color:var(--muted);font-size:12px}
#tip .s{font-size:11px;padding:0 5px;border-radius:3px;color:#fff;margin-right:4px}
#detail{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--card);border-left:1px solid var(--rule);box-shadow:-10px 0 30px #0001;overflow:auto;padding:12px 16px 30px;transform:translateX(105%);transition:transform .18s;z-index:20}
#detail.open{transform:none}
#detail .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px}
#detail .kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#detail h2{font:600 22px/1.2 var(--serif);margin:2px 0 4px}
#detail .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
#detail h4{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 7px}
#detail p{margin:0 0 8px}
#detail .sum{font-family:var(--serif);font-size:15px;font-style:italic}
#detail .appr{border-left:3px solid var(--accent);padding:2px 0 2px 10px;background:#b3261e08}
#detail .appr .cap{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
#detail a{color:var(--focus);cursor:pointer;text-decoration:none}
#detail a:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:1px 9px;font-size:12.5px;cursor:pointer;background:var(--paper)}
.chip:hover{border-color:var(--focus);color:var(--focus)}
.pill{display:inline-block;font-size:11px;border-radius:3px;padding:0 6px;margin-right:4px;color:#fff;vertical-align:1px;background:var(--faint)}
.pill.draft{background:#c9a227}.pill.sg{background:var(--sugg)}
.ms{display:grid;grid-template-columns:70px 16px 1fr;gap:2px 6px;padding:6px 0;border-top:1px dashed var(--rule);font-size:13px}
.ms .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ms .st{font-size:11.5px;color:var(--muted)}
.ms .nt{grid-column:3;font-size:12.5px;color:#4a453d}
.ms.sg{background:repeating-linear-gradient(135deg,transparent 0 6px,#7c6f5710 6px 7px)}
.lt{display:inline-block;font-size:10.5px;border-radius:3px;padding:0 4px;color:#fff;margin-left:4px;vertical-align:1px}
.ev{display:flex;gap:8px;padding:4px 0;border-top:1px dashed var(--rule);cursor:pointer;align-items:baseline;font-size:13px}
.ev:hover{color:var(--focus)}
.ev .d{font-size:12px;color:var(--muted);min-width:64px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* matrice */
#v4 .scroll{padding:14px 18px 40px}
table.mx{border-collapse:separate;border-spacing:0;font-size:12.5px}
.mx th{font-weight:600;font-size:11.5px;color:var(--muted);padding:4px 2px;vertical-align:bottom;position:sticky;top:0;background:var(--paper);z-index:2}
.mx th.c{width:46px;height:118px;white-space:nowrap}
.mx th.c span{display:inline-block;transform:rotate(-55deg);transform-origin:left bottom;margin-left:22px;width:20px}
.mx th.hl,.mx td.hl{background:#0284c70d}
.mx th.hl2,.mx td.hl2{background:#b3261e0b}
.mx td{padding:1px 2px;text-align:center;border-top:1px solid #ddd5c566;height:22px}
.mx td.nm{text-align:left;padding-right:12px;white-space:nowrap;cursor:pointer}
.mx td.nm:hover{color:var(--focus)}
.mx tr.g td{font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:14px;border-top:0}
.mx td.tot{color:var(--muted);font-size:11.5px}
.dotc{display:inline-block;border-radius:50%;cursor:pointer;vertical-align:middle}
.dotc.sg{background:transparent!important;border:1.5px dashed var(--sugg)}
/* intégration */
#v5 .scroll{padding:20px 28px 60px}
#v5 h2{font:600 22px/1.2 var(--serif);margin:0 0 6px}
#v5 h3{font:600 16px/1.3 var(--serif);margin:26px 0 8px}
#v5 p{max-width:900px}
table.it{border-collapse:collapse;font-size:13px;max-width:1150px;width:100%;background:var(--card)}
.it th,.it td{border:1px solid var(--rule);padding:7px 9px;vertical-align:top;text-align:left}
.it th{background:var(--paper2);font-size:12px}
.it td.v{font-weight:700;text-align:center;width:34px}
.it td small{color:var(--muted)}
ol.q{max-width:950px;padding-left:20px}
ol.q li{margin:0 0 10px}
ol.q li b{font-weight:600}
.cap2{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Idées <small>prototype · données réelles de timeline-db, États-Unis × Bolchevisme</small></div>
    <nav id="tabs">
      <button data-v="1" class="on"><span class="n">1</span>Frise &amp; idées</button>
      <button data-v="2"><span class="n">2</span>Courants</button>
      <button data-v="3"><span class="n">3</span>Penseurs &amp; œuvres</button>
      <button data-v="4"><span class="n">4</span>Idées × pays</button>
      <button data-v="5"><span class="n">5</span>Bilan d'intégration</button>
    </nav>
  </header>
  <aside id="side"></aside>
  <main id="stage">
    <section class="view on" id="v1">
      <div class="scroll" id="sc1"><div class="axis"><svg id="ax1" height="26"></svg></div><svg id="sv1"></svg></div>
    </section>
    <section class="view" id="v2"><div class="scroll"><svg id="sv2"></svg></div></section>
    <section class="view" id="v3"><div class="scroll"><svg id="sv3"></svg></div></section>
    <section class="view" id="v4"><div class="scroll" id="mx"></div></section>
    <section class="view" id="v5"><div class="scroll" id="integ"></div></section>
    <aside id="detail"></aside>
  </main>
</div>
<div id="tip"></div>
<script>const DATA = {"ideas":[{"id":"babouvism","nm":"Babouvisme","al":["Communisme des Égaux","Conjuration des Égaux"],"ty":"current","tr":"socialist","su":"Premier communisme révolutionnaire moderne : abolir la propriété privée par l'insurrection d'une minorité organisée.","de":"Courant né de la Conjuration des Égaux menée par Gracchus Babeuf contre le Directoire en 1796. Il réclame l'égalité réelle, et non seulement juridique, par la mise en commun des biens et du travail. Il prévoit la prise du pouvoir par une organisation secrète, suivie d'une dictature révolutionnaire transitoire. Transmis par Buonarroti, il inspire Blanqui et les sociétés secrètes du XIXe siècle.","ap":"Le Manifeste voit en Babeuf l'une des premières expressions indépendantes du prolétariat naissant, mais juge son communisme ascétique et grossier, faute de base matérielle. Sa conception conspirative, celle d'une minorité qui agit à la place des masses, est rejetée par Marx et Engels.","ms":[{"st":"emergence","y":1796.358,"ds":"10 mai 1796","n":"1796-conspiracy-of-the-equals","p":["babeuf","sylvain-marechal","buonarroti"],"note":"Sylvain Maréchal rédige le Manifeste des Égaux, qui annonce une révolution plus grande que celle de 1789."},{"st":"revival","y":1828.0,"ds":"1828","w":"conspiracy-for-equality","note":"Le livre de Buonarroti transmet l'expérience des Égaux à la génération de Blanqui."},{"st":"critique","y":1848.1233,"ds":"févr. 1848","w":"communist-manifesto","note":"Le chapitre III range Babeuf parmi les premiers porte-parole du prolétariat, au communisme encore grossier."}],"st":"draft"},{"id":"utopian-socialism","nm":"Socialisme utopique","ty":"current","tr":"socialist","su":"Projets de société harmonieuse conçus par Saint-Simon, Fourier et Owen, qui comptent sur l'exemple et la persuasion plutôt que sur la lutte des classes.","de":"Nom donné après coup, surtout par Engels, aux systèmes socialistes du début du XIXe siècle. Saint-Simon, Fourier et Owen critiquent la misère et l'anarchie de la société industrielle naissante et dessinent des sociétés idéales : phalanstères, communautés coopératives. Ils s'adressent à toutes les classes, souvent aux puissants, et misent sur des colonies modèles pour convaincre par l'exemple.","ap":"Marx et Engels reconnaissent la pénétration de leur critique du capitalisme, mais leur reprochent d'ignorer le prolétariat comme force historique autonome : faute de comprendre les lois du développement social, ils inventent la société future au lieu de la dégager du mouvement réel.","ms":[{"st":"emergence","y":1808.0,"ds":"1808","w":"theory-of-the-four-movements","p":["fourier"]},{"st":"development","y":1813.0,"ds":"1813","w":"a-new-view-of-society","p":["robert-owen"]},{"st":"critique","y":1848.1233,"ds":"févr. 1848","w":"communist-manifesto","note":"Le chapitre III fait la critique du « socialisme et communisme critico-utopiques »."},{"st":"critique","y":1880.0,"ds":"1880","w":"socialism-utopian-and-scientific","note":"Engels oppose le socialisme utopique au socialisme scientifique."}],"st":"draft"},{"id":"blanquism","nm":"Blanquisme","ty":"current","tr":"socialist","su":"Stratégie de prise du pouvoir par une minorité révolutionnaire disciplinée, agissant au nom du peuple.","de":"Doctrine d'Auguste Blanqui, héritier de Babeuf par Buonarroti. Une organisation secrète et centralisée prépare l'insurrection, s'empare du pouvoir par un coup de main et exerce une dictature révolutionnaire le temps d'éduquer le peuple. Blanqui passe plus de trente ans en prison. Les blanquistes forment une composante importante de la Commune de Paris.","ap":"Marx salue en Blanqui un révolutionnaire intransigeant, mais le marxisme rejette sa conception conspirative : la révolution est l'œuvre consciente de la majorité ouvrière, non d'un complot. Le reproche de « blanquisme » sera souvent adressé aux bolcheviks ; Lénine le récuse, car l'insurrection d'Octobre s'appuie sur la majorité des soviets.","ms":[{"st":"precursor","y":1828.0,"ds":"1828","w":"conspiracy-for-equality"},{"st":"test","y":1839.3635,"ds":"12 mai 1839","n":"1839-insurrection-of-the-seasons","p":["blanqui"],"note":"L'insurrection de la Société des Saisons échoue faute de soutien populaire."},{"st":"test","y":1871.2132,"ds":"18 mars 1871","n":"1871-paris-commune","note":"Les blanquistes forment une part de la majorité du Conseil de la Commune."},{"st":"critique","y":1874.4567,"ds":"juin 1874","w":"programme-of-the-blanquist-refugees","p":["engels"]}],"st":"draft"},{"id":"anarchism","nm":"Anarchisme","ty":"current","tr":"anarchist","su":"Courant qui veut abolir immédiatement l'État et toute autorité, et refuse l'action politique et la conquête du pouvoir.","de":"Proudhon se dit anarchiste dès 1840 et oppose à la propriété capitaliste un mutualisme de petits producteurs. Bakounine en fait un courant révolutionnaire collectiviste, hostile à toute participation à la vie politique et à tout État, y compris ouvrier. Kropotkine le prolonge en un communisme libertaire fondé sur l'entraide. Le courant pèse surtout dans les pays latins, notamment en Espagne, où il inspire la CNT.","ap":"Le marxisme partage le but d'une société sans État mais juge qu'on ne l'abolit pas par décret : la classe ouvrière doit d'abord conquérir le pouvoir et briser l'appareil bourgeois, puis l'État dépérit. En 1936, des dirigeants anarchistes espagnols entrent au gouvernement républicain au lieu de prendre le pouvoir, ce qui illustre pour les marxistes l'impasse du refus de poser la question du pouvoir.","ms":[{"st":"emergence","y":1840.0,"ds":"1840","w":"what-is-property","p":["proudhon"],"note":"Proudhon : « la propriété, c'est le vol » ; il se déclare anarchiste."},{"st":"critique","y":1847.0,"ds":"1847","w":"the-poverty-of-philosophy","p":["marx"]},{"st":"critique","y":1872.6694,"ds":"2 sept. 1872","n":"1872-hague-congress","p":["bakunin"],"note":"Exclusion de Bakounine : l'Internationale se divise."},{"st":"development","y":1892.0,"ds":"1892","w":"the-conquest-of-bread","p":["kropotkin"]},{"st":"test","y":1936.5493,"ds":"19 juil. 1936","n":"1936-spanish-revolution"}],"st":"draft"},{"id":"marxism","nm":"Marxisme","al":["Socialisme scientifique","Wissenschaftlicher Sozialismus","Scientific socialism"],"ty":"current","tr":"marxist","su":"Conception du monde et programme révolutionnaire fondés par Marx et Engels : matérialisme historique, critique de l'économie politique, lutte de classe du prolétariat.","de":"Élaboré par Marx et Engels à partir des années 1840, le marxisme réunit une méthode, le matérialisme dialectique et historique, une analyse du capitalisme (plus-value, crises, concentration du capital) et une stratégie : la classe ouvrière, en conquérant le pouvoir politique, peut abolir la propriété privée des moyens de production et ouvrir la voie à une société sans classes. Il devient la doctrine officielle de la social-démocratie allemande puis internationale à la fin du XIXe siècle.","ap":"Pour le marxisme révolutionnaire, ce n'est pas un dogme mais un guide pour l'action, qui se vérifie et s'enrichit dans la lutte. Son histoire est aussi celle d'un combat permanent contre ses déformations : révisionnisme, réformisme, stalinisme.","ms":[{"st":"emergence","y":1845.0,"ds":"1845","w":"the-german-ideology","p":["marx","engels"]},{"st":"formulation","y":1848.1233,"ds":"févr. 1848","w":"communist-manifesto"},{"st":"development","y":1867.0,"ds":"1867","w":"das-kapital"},{"st":"adoption","y":1891.7856,"ds":"14 oct. 1891","n":"1891-erfurt-programme","o":["spd"]}],"st":"draft"},{"id":"russian-populism","nm":"Populisme russe","al":["Narodnisme","Narodnichestvo","Narodism"],"ty":"current","tr":"socialist","su":"Socialisme agraire russe qui voit dans la commune paysanne la base d'un passage direct au socialisme, sans étape capitaliste.","de":"Né des idées de Herzen et de Tchernychevski, le populisme mise sur l'obchtchina, la commune rurale, et sur l'intelligentsia révolutionnaire. Après l'échec de l'« aller au peuple » de 1874, une partie se tourne vers le terrorisme individuel avec Narodnaïa Volia, qui assassine Alexandre II en 1881. Les marxistes russes se constituent en rompant avec lui.","ap":"Plekhanov puis Lénine montrent que le capitalisme se développe déjà en Russie et que la force motrice de la révolution est la classe ouvrière, non la paysannerie ni une avant-garde de conspirateurs. L'héroïsme des populistes est salué, mais le terrorisme individuel est rejeté : il remplace l'action des masses et attire la répression.","ms":[{"st":"emergence","y":1857.0,"ds":"1857","w":"kolokol","p":["herzen"],"note":"Herzen défend un « socialisme russe » fondé sur la commune rurale."},{"st":"development","y":1863.0,"ds":"1863","w":"what-is-to-be-done-novel","p":["chernyshevsky"]},{"st":"test","y":1874.0,"ds":"1874","n":"1874-going-to-the-people"},{"st":"test","y":1881.1995,"ds":"13 mars 1881","n":"1881-assassination-of-alexander-ii","o":["narodnaya-volya"]},{"st":"critique","y":1883.7067,"ds":"sept. 1883","n":"1883-emancipation-of-labour-group","p":["plekhanov"]},{"st":"critique","y":1885.0,"ds":"1885","w":"our-differences","p":["plekhanov"]}],"st":"draft"},{"id":"revisionism","nm":"Révisionnisme","al":["Réformisme","Reformism","Reformismus"],"ty":"current","tr":"socialist","br":["marxism"],"su":"Remise en cause par Bernstein des fondements révolutionnaires du marxisme au profit de réformes graduelles.","de":"À partir de 1896, Eduard Bernstein soutient que le capitalisme atténue ses contradictions, que les crises s'espacent et que les classes moyennes ne disparaissent pas. Il en conclut que le socialisme viendra par des réformes progressives et la démocratie parlementaire : « le but final n'est rien, le mouvement est tout ». Condamné officiellement par le SPD, il exprime pourtant la pratique réelle de son appareil parlementaire et syndical.","ap":"Rosa Luxemburg répond que les réformes, nécessaires, ne peuvent abolir l'exploitation, et que renoncer à la conquête du pouvoir revient à renoncer au socialisme. L'épreuve vient en 1914, quand la direction du SPD vote les crédits de guerre.","ms":[{"st":"formulation","y":1899.0,"ds":"1899","w":"preconditions-of-socialism","p":["eduard-bernstein"]},{"st":"critique","y":1899.0,"ds":"1899","w":"social-reform-or-revolution","p":["rosa-luxemburg"]},{"st":"test","y":1914.5916,"ds":"4 août 1914","n":"1914-spd-war-credits"},{"st":"adoption","y":1959.8717,"ds":"15 nov. 1959","n":"1959-godesberg-programme","note":"Le SPD abandonne officiellement toute référence au marxisme."}],"st":"draft"},{"id":"revolutionary-syndicalism","nm":"Syndicalisme révolutionnaire","ty":"current","tr":"anarchist","su":"Courant qui fait du syndicat, indépendant des partis, l'outil de la lutte quotidienne et de la révolution par la grève générale.","de":"Développé en France autour de la CGT, il se méfie de la politique parlementaire et des partis. La Charte d'Amiens de 1906 affirme l'indépendance syndicale et fixe un double but : les améliorations immédiates et l'expropriation capitaliste par la grève générale. Il inspire les IWW aux États-Unis et une aile du mouvement ouvrier britannique.","ap":"Le marxisme reconnaît la combativité de ce courant et sa méfiance saine envers le parlementarisme, mais juge qu'il esquive la question du pouvoir d'État et du parti révolutionnaire. Après 1917, nombre de syndicalistes révolutionnaires rejoignent l'Internationale communiste.","ms":[{"st":"emergence","y":1895.7269,"ds":"23 sept. 1895","n":"1895-cgt-founding"},{"st":"adoption","y":1905.4567,"ds":"juin 1905","n":"1905-iww-founding"},{"st":"adoption","y":1906.7692,"ds":"8 oct. 1906","n":"1906-charter-of-amiens"},{"st":"development","y":1912.0,"ds":"1912","w":"miners-next-step"},{"st":"test","y":1914.5916,"ds":"4 août 1914","n":"1914-sacred-union","note":"La direction de la CGT se rallie à l'Union sacrée."}],"st":"draft"},{"id":"economism","nm":"Économisme","ty":"current","tr":"marxist","br":["marxism"],"su":"Tendance de la social-démocratie russe qui limite l'action ouvrière aux luttes économiques et laisse la politique aux libéraux.","de":"Vers 1897-1901, des sociaux-démocrates russes, autour du journal Rabotchaïa Mysl, estiment que les ouvriers doivent se concentrer sur leurs revendications économiques. Le « Credo » rédigé par Kouskova en 1899 propose de laisser la lutte politique contre l'autocratie à la bourgeoisie libérale.","ap":"Lénine y voit un culte de la spontanéité : laissée à elle-même, la lutte économique ne dépasse pas la conscience syndicale. Que faire ? défend un parti qui porte la conscience socialiste dans la classe ouvrière et organise sa lutte politique contre l'autocratie.","ms":[{"st":"formulation","y":1899.0,"ds":"1899","w":"credo-1899","p":["yekaterina-kuskova"]},{"st":"critique","y":1899.0,"ds":"1899","p":["lenin"],"note":"Protestation des sociaux-démocrates de Russie, adoptée par des exilés en Sibérie."},{"st":"critique","y":1902.2067,"ds":"mars 1902","w":"what-is-to-be-done","p":["lenin"]}],"st":"draft"},{"id":"menshevism","nm":"Menchevisme","ty":"current","tr":"marxist","br":["marxism"],"su":"Aile modérée du POSDR, pour qui la révolution russe devait être bourgeoise et dirigée par la bourgeoisie libérale.","de":"Née de la scission du IIe congrès du POSDR en 1903 sur les statuts du parti, la fraction menchevique, autour de Martov, défend un parti plus large et moins centralisé. Après 1905, elle soutient que la Russie doit passer par une révolution bourgeoise et une longue phase capitaliste, pendant laquelle les ouvriers soutiennent les libéraux. En 1917, ses dirigeants entrent au gouvernement provisoire.","ap":"Pour les bolcheviks, la théorie des étapes condamne la classe ouvrière à se subordonner à une bourgeoisie incapable de mener sa propre révolution. La participation des mencheviks au gouvernement de coalition, qui poursuit la guerre et ajourne la réforme agraire, confirme ce diagnostic.","ms":[{"st":"emergence","y":1903.5795,"ds":"30 juil. 1903","n":"1903-rsdlp-second-congress","p":["martov"],"o":["mensheviks"]},{"st":"test","y":1917.3799,"ds":"18 mai 1917","n":"1917-first-coalition-government","o":["mensheviks"]}],"st":"draft"},{"id":"bolshevism","nm":"Bolchevisme","ty":"current","tr":"marxist","br":["marxism"],"tl":"bolshevism","su":"Courant marxiste révolutionnaire formé par Lénine, qui conduit la classe ouvrière russe au pouvoir en 1917.","de":"Il naît de la scission de 1903 et se forge dans la révolution de 1905, la réaction et le renouveau du mouvement ouvrier. Ses traits : un parti de cadres centralisé et démocratique, l'indépendance de la classe ouvrière vis-à-vis de la bourgeoisie libérale, l'alliance avec la paysannerie, l'internationalisme contre la guerre de 1914. Les Thèses d'avril l'orientent vers la prise du pouvoir par les soviets. Après 1919, il devient le modèle de l'Internationale communiste.","ap":"Le marxisme révolutionnaire y voit l'application la plus achevée du marxisme à la question du pouvoir. La dégénérescence stalinienne, produit de l'isolement de la révolution dans un pays arriéré, n'en est pas le prolongement mais la négation.","ms":[{"st":"formulation","y":1902.2067,"ds":"mars 1902","w":"what-is-to-be-done","p":["lenin"]},{"st":"emergence","y":1903.5795,"ds":"30 juil. 1903","n":"1903-rsdlp-second-congress","o":["bolsheviks"]},{"st":"adoption","y":1912.0466,"ds":"18 janv. 1912","n":"1912-prague-conference","note":"Les bolcheviks se constituent en parti distinct."},{"st":"development","y":1917.2938,"ds":"17 avr. 1917","n":"1917-april-theses","p":["lenin"]},{"st":"test","y":1917.8498,"ds":"7 nov. 1917","n":"1917-second-congress-of-soviets"},{"st":"adoption","y":1919.1694,"ds":"2 mars 1919","n":"1919-founding-of-the-comintern","o":["comintern"]}],"st":"draft"},{"id":"stalinism","nm":"Stalinisme","al":["Marxisme-léninisme (doctrine officielle)"],"ty":"current","tr":"marxist","br":["bolshevism"],"su":"Régime et idéologie de la bureaucratie soviétique, qui se réclame du marxisme-léninisme tout en en renversant le contenu.","de":"Le terme désigne à la fois le régime établi en URSS sous Staline et le courant qui en dérive dans les partis communistes. Il repose sur la théorie du socialisme dans un seul pays, le monopole d'une couche bureaucratique privilégiée sur l'État et le parti, la planification autoritaire, la répression des opposants (procès de Moscou, Grande Terreur) et la subordination des partis communistes à la politique extérieure de l'URSS. Le « marxisme-léninisme » codifié en est la doctrine officielle.","ap":"Pour Trotski et le marxisme révolutionnaire, le stalinisme n'est pas le prolongement du bolchevisme mais sa négation : une contre-révolution politique bureaucratique, née de l'isolement de la révolution dans un pays arriéré, qui conserve l'économie planifiée tout en étouffant la démocratie ouvrière. Il a discrédité le communisme aux yeux de millions de travailleurs.","ms":[{"st":"emergence","y":1924.9567,"ds":"déc. 1924","n":"1924-socialism-in-one-country","p":["stalin"]},{"st":"test","y":1927.8635,"ds":"12 nov. 1927","n":"1927-expulsion-of-trotsky-and-zinoviev","note":"La bureaucratie écrase l'opposition."},{"st":"test","y":1936.6326,"ds":"19 août 1936","n":"1936-great-purge"},{"st":"critique","y":1956.1491,"ds":"25 févr. 1956","n":"1956-secret-speech","note":"Khrouchtchev dénonce le « culte de la personnalité » sans remettre en cause le pouvoir de la bureaucratie."}],"st":"draft"},{"id":"trotskyism","nm":"Trotskisme","ty":"current","tr":"marxist","br":["bolshevism"],"su":"Courant issu de l'Opposition de gauche, qui défend contre le stalinisme la révolution permanente, la démocratie ouvrière et l'internationalisme.","de":"Le terme, d'abord employé par ses adversaires, désigne les partisans de Trotski. L'Opposition de gauche se forme en 1923 contre la bureaucratisation du parti et de l'État soviétiques. Exclue et persécutée, elle se réorganise à l'échelle internationale et fonde en 1938 la IVe Internationale, dotée du Programme de transition. Ses thèses : révolution permanente, analyse de l'URSS comme État ouvrier dégénéré, front unique contre le fascisme, rejet des fronts populaires.","ap":"Ses partisans s'en réclament comme de la continuité du bolchevisme de Lénine. Après la mort de Trotski, le mouvement se divise en nombreuses tendances.","ms":[{"st":"emergence","y":1923.7884,"ds":"15 oct. 1923","n":"1923-declaration-of-the-46","o":["left-opposition"]},{"st":"development","y":1923.9567,"ds":"déc. 1923","w":"the-new-course","p":["trotsky"]},{"st":"adoption","y":1938.6721,"ds":"3 sept. 1938","n":"1938-founding-of-the-fourth-international","o":["fourth-international"]}],"st":"draft"},{"id":"maoism","nm":"Maoïsme","ty":"current","tr":"marxist","br":["stalinism"],"su":"Courant issu de la révolution chinoise, qui fait de la paysannerie et de la guerre populaire prolongée le moteur de la révolution.","de":"Formé par Mao Zedong entre 1927 et 1945, après l'écrasement du mouvement ouvrier urbain, il repose sur l'armée paysanne et les bases rurales, la théorie de la démocratie nouvelle (bloc de classes sous direction du parti) et la guerre populaire prolongée. Inscrit dans les statuts du PCC en 1945 sous le nom de « pensée Mao Zedong », il devient après la rupture sino-soviétique un pôle concurrent de Moscou et inspire de nombreux mouvements du tiers-monde et de la jeunesse occidentale des années 1960.","ap":"Le marxisme révolutionnaire y voit une variante du stalinisme : la révolution de 1949 renverse le capitalisme mais établit d'emblée un régime bureaucratique sur le modèle soviétique, sans démocratie ouvrière. Le déplacement du centre de gravité vers la paysannerie est jugé comme une rupture avec le rôle dirigeant de la classe ouvrière.","ms":[{"st":"emergence","y":1927.2067,"ds":"mars 1927","n":"1927-mao-report-on-hunan-peasant-movement","p":["mao-zedong"]},{"st":"formulation","y":1940.04,"ds":"janv. 1940","w":"on-new-democracy"},{"st":"adoption","y":1945.3103,"ds":"23 avr. 1945","n":"1945-seventh-ccp-congress","note":"La « pensée Mao Zedong » entre dans les statuts du PCC."},{"st":"test","y":1966.3744,"ds":"16 mai 1966","n":"1966-cultural-revolution"}],"st":"draft"},{"id":"historical-materialism","nm":"Matérialisme historique","al":["Conception matérialiste de l'histoire","Materialistische Geschichtsauffassung"],"ty":"method","tr":"marxist","br":["marxism"],"su":"Méthode d'analyse selon laquelle le développement des forces productives et les rapports de production conditionnent l'ensemble de la vie sociale.","de":"Marx et Engels posent que ce n'est pas la conscience des hommes qui détermine leur être, mais leur être social qui détermine leur conscience. Chaque mode de production repose sur des rapports de production qui correspondent à un certain niveau des forces productives ; quand ils deviennent une entrave, s'ouvre une époque de révolution sociale. Engels précise plus tard que l'économie n'est déterminante qu'« en dernière instance » et que les superstructures politiques et idéologiques agissent en retour.","ms":[{"st":"emergence","y":1845.0,"ds":"1845","w":"the-german-ideology","note":"Rédigée en 1845-1846, publiée en 1932."},{"st":"formulation","y":1859.0,"ds":"1859","w":"contribution-to-the-critique-of-political-economy","note":"La préface en donne l'exposé classique."},{"st":"development","y":1890.7067,"ds":"sept. 1890","p":["engels"],"note":"Lettre à Joseph Bloch contre la lecture mécaniste de la théorie."}],"st":"draft"},{"id":"dialectical-materialism","nm":"Matérialisme dialectique","al":["Diamat"],"ty":"method","tr":"marxist","br":["marxism"],"su":"Philosophie du marxisme, qui reprend la dialectique de Hegel sur une base matérialiste : le monde est matière en mouvement, traversé de contradictions.","de":"Marx et Engels retiennent de Hegel l'idée que toute réalité est processus, développement par contradictions et sauts qualitatifs, mais rejettent son idéalisme : ce sont les idées qui reflètent le monde matériel, et non l'inverse. Engels systématise cette conception dans l'Anti-Dühring. Le terme lui-même apparaît chez les continuateurs de Marx à la fin des années 1880.","ap":"Sous Staline, il devient un catéchisme officiel, le « diamat », qui sert à justifier chaque tournant de la bureaucratie. Le marxisme révolutionnaire défend au contraire la dialectique comme méthode vivante de pensée.","ms":[{"st":"precursor","y":1812.0,"ds":"1812","w":"science-of-logic","p":["hegel"]},{"st":"precursor","y":1841.0,"ds":"1841","w":"the-essence-of-christianity","p":["feuerbach"],"note":"Feuerbach renverse l'idéalisme hégélien en un matérialisme encore contemplatif."},{"st":"emergence","y":1845.0,"ds":"1845","w":"theses-on-feuerbach","note":"Rédigées en 1845, publiées par Engels en 1888."},{"st":"formulation","y":1878.0,"ds":"1878","w":"anti-duhring"},{"st":"revision","y":1938.0,"ds":"1938","p":["stalin"],"note":"« Matérialisme dialectique et matérialisme historique », chapitre du Précis d'histoire du PC(b) de l'URSS, codifie la doctrine officielle."}],"st":"draft"},{"id":"class-struggle","nm":"Lutte des classes","ty":"theory","tr":"marxist","br":["historical-materialism"],"su":"Conflit entre classes aux intérêts opposés, moteur de l'histoire des sociétés divisées en classes.","de":"Les historiens libéraux de la Restauration française avaient déjà décrit la lutte entre bourgeoisie et noblesse. Marx et Engels en font la clé de toute l'histoire écrite : l'histoire de toute société jusqu'à nos jours est l'histoire de luttes de classes. Sous le capitalisme, elle oppose essentiellement la bourgeoisie, propriétaire des moyens de production, au prolétariat, qui ne possède que sa force de travail.","ms":[{"st":"precursor","y":1820.0,"ds":"v. 1820","note":"Augustin Thierry, François Guizot et François Mignet décrivent l'histoire de France comme une lutte de classes."},{"st":"formulation","y":1848.1233,"ds":"févr. 1848","w":"communist-manifesto"},{"st":"development","y":1850.0,"ds":"1850","w":"class-struggles-in-france"},{"st":"development","y":1852.1776,"ds":"5 mars 1852","w":"letter-to-weydemeyer-1852","note":"Marx précise que son apport n'est pas la découverte des classes, mais le lien entre leur lutte et la dictature du prolétariat."}],"st":"draft"},{"id":"alienation","nm":"Aliénation","ty":"concept","tr":"marxist","br":["marxism"],"su":"Dépossession du travailleur, à qui le produit et l'activité de son propre travail deviennent étrangers et hostiles.","de":"Hegel et Feuerbach emploient la notion pour l'esprit et la religion : l'homme projette son essence dans un dieu qui le domine. Dans les Manuscrits de 1844, Marx la transpose au travail salarié : l'ouvrier est séparé du produit de son travail, de son activité, de ses semblables et de sa propre nature humaine. Restés inédits jusqu'en 1932, ces textes nourrissent après la guerre les lectures « humanistes » du marxisme.","ms":[{"st":"precursor","y":1841.0,"ds":"1841","w":"the-essence-of-christianity","p":["feuerbach"]},{"st":"formulation","y":1844.0,"ds":"1844","w":"economic-and-philosophic-manuscripts","p":["marx"]},{"st":"revival","y":1932.0,"ds":"1932","w":"economic-and-philosophic-manuscripts","note":"La publication des Manuscrits relance le débat sur le « jeune Marx »."}],"st":"draft"},{"id":"labour-theory-of-value","nm":"Théorie de la valeur-travail","ty":"theory","tr":"liberal","su":"La valeur des marchandises est déterminée par la quantité de travail nécessaire à leur production.","de":"Esquissée par Adam Smith et systématisée par David Ricardo, elle est au cœur de l'économie politique classique. Marx la reprend et la transforme : la valeur est déterminée par le temps de travail socialement nécessaire, et la force de travail est elle-même une marchandise dont l'usage crée plus de valeur qu'elle n'en coûte. À partir des années 1870, l'économie dominante l'abandonne pour la théorie marginaliste de la valeur-utilité.","ap":"Pour le marxisme, l'abandon de la valeur-travail par l'économie universitaire après Marx tient moins à des raisons scientifiques qu'au fait qu'elle conduisait à la théorie de l'exploitation.","ms":[{"st":"emergence","y":1776.1886,"ds":"9 mars 1776","w":"the-wealth-of-nations","p":["adam-smith"]},{"st":"formulation","y":1817.0,"ds":"1817","w":"principles-of-political-economy-ricardo","p":["david-ricardo"]},{"st":"revision","y":1867.0,"ds":"1867","w":"das-kapital","p":["marx"]},{"st":"critique","y":1871.0,"ds":"1871","note":"Jevons, Menger puis Walras fondent l'économie marginaliste."}],"st":"draft"},{"id":"surplus-value","nm":"Plus-value","ty":"theory","tr":"marxist","br":["marxism"],"su":"Valeur produite par l'ouvrier au-delà de la valeur de sa force de travail et appropriée par le capitaliste : la source du profit.","de":"Le capitaliste achète la force de travail à sa valeur, celle des biens nécessaires à sa reproduction. Mais en une journée, l'ouvrier produit davantage que cette valeur : la différence, non payée, est la plus-value, d'où proviennent profit, intérêt et rente. Marx distingue la plus-value absolue, obtenue en allongeant la journée de travail, et la plus-value relative, obtenue par la hausse de la productivité.","ms":[{"st":"precursor","y":1817.0,"ds":"1817","w":"principles-of-political-economy-ricardo"},{"st":"emergence","y":1857.0,"ds":"1857","w":"grundrisse","note":"Manuscrits de 1857-1858, publiés en 1939-1941."},{"st":"development","y":1865.4567,"ds":"juin 1865","p":["marx"],"note":"Exposé devant le Conseil général de l'AIT, publié en 1898 sous le titre Salaire, prix et profit."},{"st":"formulation","y":1867.0,"ds":"1867","w":"das-kapital"}],"st":"draft"},{"id":"commodity-fetishism","nm":"Fétichisme de la marchandise","ty":"concept","tr":"marxist","br":["marxism"],"su":"Dans la société marchande, les rapports sociaux entre producteurs prennent l'apparence de rapports entre choses.","de":"Dans le premier chapitre du Capital, Marx montre que la valeur d'une marchandise semble une propriété naturelle de l'objet, alors qu'elle exprime un rapport social : le travail de producteurs indépendants ne devient social que par l'échange. Les hommes sont alors dominés par le mouvement des choses qu'ils produisent, comme les croyants par leurs dieux. Lukács prolonge l'idée avec la notion de réification.","ms":[{"st":"formulation","y":1867.0,"ds":"1867","w":"das-kapital","note":"Livre I, chapitre 1."},{"st":"development","y":1923.0,"ds":"1923","w":"history-and-class-consciousness","p":["georg-lukacs"],"note":"Notion de réification."}],"st":"draft"},{"id":"imperialism","nm":"Impérialisme","ty":"theory","tr":"marxist","br":["marxism"],"su":"Stade du capitalisme dominé par les monopoles et le capital financier, qui pousse les grandes puissances à se partager le monde.","de":"Hobson décrit dès 1902 l'expansion coloniale comme un débouché pour les capitaux excédentaires. Hilferding analyse la fusion du capital bancaire et industriel en capital financier ; Rosa Luxemburg lie l'accumulation à la conquête de marchés non capitalistes. Lénine en fait la synthèse en 1916 : concentration en monopoles, exportation de capitaux, partage du monde entre trusts et entre puissances, d'où les guerres mondiales. Les surprofits permettent aussi d'acheter une couche supérieure de la classe ouvrière.","ap":"Pour Lénine, l'impérialisme est le stade suprême du capitalisme, l'époque des guerres et des révolutions : la guerre de 1914 n'est pas un accident mais le produit de la lutte pour le repartage du monde.","ms":[{"st":"precursor","y":1902.0,"ds":"1902","w":"imperialism-a-study","p":["john-hobson"]},{"st":"development","y":1910.0,"ds":"1910","w":"finance-capital","p":["rudolf-hilferding"]},{"st":"development","y":1913.0,"ds":"1913","w":"the-accumulation-of-capital","p":["rosa-luxemburg"]},{"st":"test","y":1914.574,"ds":"28 juil. 1914","n":"1914-first-world-war"},{"st":"formulation","y":1916.0,"ds":"1916","w":"imperialism-the-highest-stage-of-capitalism","p":["lenin"],"note":"Rédigé en 1916, publié en 1917."}],"st":"draft"},{"id":"combined-and-uneven-development","nm":"Développement inégal et combiné","ty":"theory","tr":"marxist","br":["permanent-revolution"],"su":"Les pays arriérés, entraînés par le marché mondial, combinent les formes les plus archaïques et les plus modernes de la production et de la société.","de":"Trotski observe que la Russie tsariste ne refait pas le chemin de l'Angleterre : elle importe d'emblée les usines géantes et la technique la plus moderne, au milieu d'une paysannerie quasi médiévale. Cette combinaison produit une bourgeoisie faible, dépendante du capital étranger et de l'autocratie, et un prolétariat concentré et combatif. Elle fonde la théorie de la révolution permanente.","ms":[{"st":"precursor","y":1881.2067,"ds":"mars 1881","p":["marx","zasulich"],"note":"Dans sa réponse à Vera Zassoulitch, Marx admet que la commune rurale russe pourrait servir de point d'appui à une régénération sociale sans passage obligé par le capitalisme."},{"st":"emergence","y":1906.0,"ds":"1906","w":"results-and-prospects","p":["trotsky"]},{"st":"formulation","y":1930.0,"ds":"1930","w":"history-of-the-russian-revolution","note":"Le premier chapitre énonce la loi du développement inégal et combiné."}],"st":"draft"},{"id":"labour-aristocracy","nm":"Aristocratie ouvrière","ty":"concept","tr":"marxist","br":["imperialism"],"su":"Couche supérieure de la classe ouvrière, mieux payée grâce aux surprofits impérialistes, base sociale du réformisme.","de":"Engels remarque dès 1858 que le prolétariat anglais s'embourgeoise grâce au monopole industriel et colonial de l'Angleterre. Lénine généralise l'idée en 1916 : les surprofits impérialistes permettent de corrompre une minorité d'ouvriers qualifiés et de bureaucrates syndicaux et politiques, sur laquelle s'appuie l'opportunisme qui a capitulé en 1914.","ms":[{"st":"emergence","y":1858.7664,"ds":"7 oct. 1858","p":["engels","marx"],"note":"Lettre d'Engels à Marx sur un prolétariat anglais qui s'embourgeoise."},{"st":"development","y":1892.0,"ds":"1892","w":"condition-of-the-working-class-in-england","p":["engels"],"note":"Préface d'Engels à l'édition anglaise de 1892."},{"st":"formulation","y":1916.9567,"ds":"déc. 1916","w":"imperialism-and-the-split-in-socialism","p":["lenin"]}],"st":"draft"},{"id":"marxist-theory-of-the-state","nm":"Théorie marxiste de l'État","ty":"theory","tr":"marxist","br":["marxism"],"su":"L'État est l'instrument de domination d'une classe sur une autre, né de l'inconciliabilité des antagonismes de classe.","de":"Pour Marx et Engels, l'État n'est pas un arbitre au-dessus de la société mais un appareil de détachements d'hommes armés, de prisons et de fonctionnaires au service de la classe dominante ; le gouvernement moderne n'est qu'un comité qui gère les affaires communes de la bourgeoisie. Engels en retrace la genèse historique. Lénine, en 1917, en tire les conséquences pour la révolution : briser l'État bourgeois, instaurer la dictature du prolétariat, laisser dépérir l'État.","ms":[{"st":"emergence","y":1848.1233,"ds":"févr. 1848","w":"communist-manifesto"},{"st":"formulation","y":1884.0,"ds":"1884","w":"origin-of-the-family","p":["engels"]},{"st":"development","y":1917.6233,"ds":"août 1917","w":"the-state-and-revolution","p":["lenin"],"note":"Rédigé en août-septembre 1917, publié en 1918."}],"st":"draft"},{"id":"smashing-the-state-machine","nm":"Destruction de la machine d'État","ty":"concept","tr":"marxist","br":["marxist-theory-of-the-state"],"su":"La classe ouvrière ne peut se contenter de prendre l'appareil d'État bourgeois tel quel : elle doit le briser et le remplacer.","de":"Dans Le 18 Brumaire, Marx note que les révolutions passées ont perfectionné la machine d'État au lieu de la briser. La Commune de Paris lui montre ce qui la remplace : élus révocables, payés comme des ouvriers, armement du peuple au lieu de l'armée permanente. C'est la seule correction que Marx et Engels apportent au Manifeste, dans la préface de 1872.","ms":[{"st":"emergence","y":1852.0,"ds":"1852","w":"eighteenth-brumaire","p":["marx"]},{"st":"test","y":1871.2132,"ds":"18 mars 1871","n":"1871-paris-commune"},{"st":"formulation","y":1871.4567,"ds":"juin 1871","w":"civil-war-in-france","p":["marx"]},{"st":"development","y":1872.4567,"ds":"juin 1872","p":["marx","engels"],"note":"Préface à l'édition allemande du Manifeste : la classe ouvrière ne peut se contenter de prendre telle quelle la machine de l'État."},{"st":"development","y":1917.6233,"ds":"août 1917","w":"the-state-and-revolution","p":["lenin"]}],"st":"draft"},{"id":"dictatorship-of-the-proletariat","nm":"Dictature du prolétariat","ty":"concept","tr":"marxist","br":["marxist-theory-of-the-state"],"su":"Pouvoir politique de la classe ouvrière, qui succède à l'État bourgeois pendant la transition vers une société sans classes.","de":"Pour Marx, « dictature » désigne la domination d'une classe, quelle que soit la forme du régime : la démocratie parlementaire est une dictature de la bourgeoisie. La dictature du prolétariat est le pouvoir de l'immense majorité contre la minorité des exploiteurs, sous une forme plus démocratique que tout régime bourgeois ; pour Engels, la Commune de Paris en est l'exemple. Souvent attribuée à Blanqui, l'expression ne se trouve pas chez lui.","ap":"Le stalinisme a identifié la notion au pouvoir d'un parti unique et d'une bureaucratie, ce qui a permis aux réformistes de l'abandonner au nom de la démocratie. Pour le marxisme révolutionnaire, elle reste inséparable de la démocratie ouvrière : conseils élus et révocables, armement du peuple.","ms":[{"st":"emergence","y":1850.0,"ds":"1850","w":"class-struggles-in-france","p":["marx"]},{"st":"formulation","y":1852.1776,"ds":"5 mars 1852","w":"letter-to-weydemeyer-1852","p":["marx","joseph-weydemeyer"]},{"st":"development","y":1875.0,"ds":"1875","w":"critique-of-the-gotha-programme","note":"Entre la société capitaliste et la société communiste se place une période de transformation révolutionnaire, dont l'État ne peut être que la dictature révolutionnaire du prolétariat."},{"st":"development","y":1891.2132,"ds":"18 mars 1891","p":["engels"],"note":"Introduction à La Guerre civile en France : la Commune de Paris, c'était la dictature du prolétariat."},{"st":"development","y":1917.6233,"ds":"août 1917","w":"the-state-and-revolution","p":["lenin"]},{"st":"critique","y":1918.0,"ds":"1918","w":"the-dictatorship-of-the-proletariat-kautsky","p":["karl-kautsky"]},{"st":"development","y":1918.0,"ds":"1918","w":"the-proletarian-revolution-and-the-renegade-kautsky","p":["lenin"]},{"st":"abandonment","y":1976.0916,"ds":"4 févr. 1976","n":"1976-pcf-twenty-second-congress","o":["pcf"]}],"st":"draft"},{"id":"withering-away-of-the-state","nm":"Dépérissement de l'État","ty":"concept","tr":"marxist","br":["marxist-theory-of-the-state"],"su":"Une fois les classes abolies, l'État, devenu inutile, s'éteint de lui-même au lieu d'être aboli d'un coup.","de":"Engels écrit dans l'Anti-Dühring que l'État n'est pas « aboli », il « s'éteint » : à mesure que la production est organisée en commun et que les classes disparaissent, les fonctions de coercition deviennent superflues et le gouvernement des personnes fait place à l'administration des choses. Lénine insiste : l'État ouvrier est déjà un « demi-État » qui doit commencer à dépérir dès le lendemain de la révolution.","ap":"Sous Staline, l'État soviétique ne cesse au contraire de se renforcer, et la doctrine officielle justifie ce renforcement : pour Trotski, c'est le signe que la bureaucratie s'est élevée au-dessus de la société.","ms":[{"st":"formulation","y":1878.0,"ds":"1878","w":"anti-duhring","p":["engels"]},{"st":"development","y":1917.6233,"ds":"août 1917","w":"the-state-and-revolution","p":["lenin"]},{"st":"revision","y":1939.2067,"ds":"mars 1939","p":["stalin"],"note":"Au XVIIIe congrès, Staline rejette comme erronée l'idée d'un dépérissement prochain de l'État."}],"st":"draft"},{"id":"two-phases-of-communism","nm":"Deux phases du communisme","ty":"concept","tr":"marxist","br":["marxism"],"su":"La société communiste naît d'abord marquée par le capitalisme, « à chacun selon son travail », avant d'atteindre sa phase supérieure, « à chacun selon ses besoins ».","de":"Dans la Critique du programme de Gotha, Marx distingue une phase inférieure, où chacun reçoit selon le travail fourni et où subsiste le « droit bourgeois », et une phase supérieure, où l'abondance et la disparition de la division entre travail manuel et intellectuel permettent la règle « de chacun selon ses capacités, à chacun selon ses besoins ». Lénine nomme la première socialisme et la seconde communisme.","ap":"En proclamant en 1936 le socialisme « réalisé » dans un pays pauvre où l'inégalité se creuse, Staline vide la notion de son contenu : pour Trotski, l'URSS est alors une société de transition, encore loin de la phase inférieure.","ms":[{"st":"formulation","y":1875.0,"ds":"1875","w":"critique-of-the-gotha-programme","p":["marx"]},{"st":"development","y":1917.6233,"ds":"août 1917","w":"the-state-and-revolution","p":["lenin"]},{"st":"revision","y":1936.9276,"ds":"5 déc. 1936","n":"1936-stalin-constitution","note":"Le socialisme est déclaré réalisé en URSS."}],"st":"draft"},{"id":"permanent-revolution","nm":"Révolution permanente","al":["Revolution in Permanenz"],"ty":"theory","tr":"marxist","br":["marxism"],"su":"Dans les pays arriérés, seule la classe ouvrière peut accomplir les tâches de la révolution bourgeoise, et elle ne peut s'y arrêter.","de":"Marx et Engels emploient l'expression en 1850 : les ouvriers ne doivent pas s'arrêter aux conquêtes démocratiques mais pousser la révolution jusqu'à la prise du pouvoir. Trotski la reformule après 1905 : dans un pays arriéré, la bourgeoisie est trop faible et trop liée à la réaction pour mener sa propre révolution ; la classe ouvrière, à la tête de la paysannerie, doit prendre le pouvoir, et elle passera inévitablement des tâches démocratiques aux tâches socialistes. La révolution ne peut s'achever dans un seul pays : elle doit s'étendre à l'échelle internationale.","ap":"La révolution d'Octobre la confirme : les Thèses d'avril de Lénine rejoignent en pratique la perspective de Trotski. Son abandon au profit de la théorie des étapes conduit à la défaite de la révolution chinoise de 1925-1927.","ms":[{"st":"emergence","y":1850.2067,"ds":"mars 1850","w":"address-of-the-central-committee-1850","p":["marx","engels"],"note":"Marx et Engels appellent les ouvriers à rendre la révolution permanente face à la démocratie petite-bourgeoise."},{"st":"formulation","y":1906.0,"ds":"1906","w":"results-and-prospects","p":["trotsky"]},{"st":"test","y":1917.0,"ds":"1917","n":"1917-revolution-year","note":"Octobre confirme le pronostic : le prolétariat prend le pouvoir à la tête de la paysannerie."},{"st":"critique","y":1924.9567,"ds":"déc. 1924","n":"1924-socialism-in-one-country","p":["stalin"]},{"st":"test","y":1927.3733,"ds":"mai 1927","n":"1927-stalin-trotsky-debate-on-china"},{"st":"development","y":1930.0,"ds":"1930","w":"the-permanent-revolution","p":["trotsky"]}],"st":"draft"},{"id":"stages-theory","nm":"Théorie des étapes","al":["Révolution par étapes","Two-stage theory","Zwei-Etappen-Theorie"],"ty":"theory","tr":"marxist","su":"Dans un pays arriéré, la révolution doit d'abord être démocratique bourgeoise, la révolution socialiste étant renvoyée à une étape ultérieure.","de":"Issue des premiers marxistes russes autour de Plekhanov, elle devient la position des mencheviks : la classe ouvrière doit soutenir la bourgeoisie libérale dans la révolution bourgeoise. Reprise par l'Internationale stalinisée, elle justifie en Chine l'alliance avec le Kuomintang, le « bloc des quatre classes », puis les fronts populaires et la démocratie nouvelle maoïste.","ap":"Pour les tenants de la révolution permanente, elle subordonne la classe ouvrière à une bourgeoisie qui la trahit au moment décisif : le massacre de Shanghai en 1927 en est l'exemple tragique.","ms":[{"st":"emergence","y":1883.7067,"ds":"sept. 1883","n":"1883-emancipation-of-labour-group","p":["plekhanov"]},{"st":"formulation","y":1905.0,"ds":"1905","o":["mensheviks"],"note":"Les mencheviks réservent la direction de la révolution à la bourgeoisie libérale."},{"st":"test","y":1917.1858,"ds":"8 mars 1917","n":"1917-february-to-october"},{"st":"test","y":1927.2801,"ds":"12 avr. 1927","n":"1927-shanghai-massacre","note":"Le Kuomintang, allié des communistes, écrase les ouvriers de Shanghai."},{"st":"development","y":1940.04,"ds":"janv. 1940","w":"on-new-democracy","p":["mao-zedong"]}],"st":"draft"},{"id":"all-power-to-the-soviets","nm":"Tout le pouvoir aux soviets !","ty":"slogan","tr":"marxist","br":["bolshevism"],"su":"Mot d'ordre bolchevique de 1917 : transférer tout le pouvoir aux conseils d'ouvriers et de soldats.","de":"Les soviets naissent en 1905 comme comités de grève élus. Rétablis en février 1917, ils partagent le pouvoir avec le gouvernement provisoire : c'est la dualité de pouvoir. Dans les Thèses d'avril, Lénine appelle à leur remettre tout le pouvoir. Il retire provisoirement le mot d'ordre après les journées de juillet, quand les directions conciliatrices des soviets couvrent la répression, puis le reprend quand les bolcheviks y deviennent majoritaires. Le IIe congrès des soviets l'accomplit en novembre 1917.","ms":[{"st":"emergence","y":1905.8185,"ds":"26 oct. 1905","n":"1905-petersburg-soviet"},{"st":"formulation","y":1917.3021,"ds":"20 avr. 1917","w":"april-theses","p":["lenin"]},{"st":"abandonment","y":1917.5411,"ds":"16 juil. 1917","n":"1917-july-days","note":"Lénine retire provisoirement le mot d'ordre."},{"st":"revival","y":1917.7692,"ds":"8 oct. 1917","n":"1917-bolsheviks-win-petrograd-soviet"},{"st":"adoption","y":1917.8498,"ds":"7 nov. 1917","n":"1917-second-congress-of-soviets"}],"st":"draft"},{"id":"workers-control","nm":"Contrôle ouvrier","ty":"concept","tr":"marxist","su":"Contrôle exercé par les travailleurs organisés sur la gestion des entreprises, étape vers la gestion ouvrière de l'économie.","de":"En 1917, les comités d'usine russes imposent leur contrôle sur l'embauche, la production et les comptes ; le décret du 27 novembre 1917 le généralise. À Turin, en 1919-1920, les conseils d'usine animés par Gramsci et L'Ordine Nuovo en font la cellule d'un futur pouvoir ouvrier ; l'occupation des usines de 1920 reste sans débouché politique. Le Programme de transition reprend la revendication comme école de la planification.","ap":"Dans la Russie de la guerre civile et de la NEP, le contrôle ouvrier recule devant la direction unique et l'appareil bureaucratique ; pour l'Opposition de gauche, le rétablissement de la démocratie ouvrière était une condition de la planification.","ms":[{"st":"adoption","y":1917.9046,"ds":"27 nov. 1917","n":"1917-decree-on-workers-control"},{"st":"development","y":1919.3333,"ds":"1 mai 1919","w":"l-ordine-nuovo","p":["antonio-gramsci"],"note":"Les conseils d'usine de Turin."},{"st":"test","y":1920.6628,"ds":"30 août 1920","n":"1920-occupation-of-the-factories"},{"st":"revision","y":1921.2215,"ds":"21 mars 1921","n":"1921-nep-and-rise-of-the-bureaucracy"},{"st":"adoption","y":1938.0,"ds":"1938","w":"transitional-programme"}],"st":"draft"},{"id":"degenerated-workers-state","nm":"État ouvrier dégénéré","ty":"theory","tr":"marxist","br":["trotskyism"],"su":"Analyse trotskiste de l'URSS : un État fondé sur la propriété collective, mais dominé par une bureaucratie qui a confisqué le pouvoir aux travailleurs.","de":"Pour Trotski, la révolution d'Octobre a créé un État ouvrier, mais son isolement dans un pays arriéré a permis à une caste bureaucratique de s'élever au-dessus de la société. L'économie nationalisée et planifiée subsiste, ce qui distingue l'URSS d'un État capitaliste, mais la classe ouvrière a perdu le pouvoir politique. Deux issues sont possibles : une révolution politique qui rétablit la démocratie soviétique, ou une restauration capitaliste menée par la bureaucratie elle-même.","ap":"Le pronostic de La Révolution trahie se vérifie en 1989-1991 : faute de révolution politique, la bureaucratie restaure le capitalisme. D'autres courants contestent l'analyse et qualifient l'URSS de capitalisme d'État ou de collectivisme bureaucratique.","ms":[{"st":"emergence","y":1923.9567,"ds":"déc. 1923","w":"the-new-course","p":["trotsky"]},{"st":"formulation","y":1936.0,"ds":"1936","w":"the-revolution-betrayed","p":["trotsky"]},{"st":"critique","y":1948.0,"ds":"1948","note":"Tony Cliff analyse l'URSS comme un capitalisme d'État."},{"st":"test","y":1991.9852,"ds":"26 déc. 1991","n":"1991-dissolution-of-the-ussr"}],"st":"draft"},{"id":"self-emancipation-of-the-working-class","nm":"Émancipation des travailleurs par eux-mêmes","ty":"concept","tr":"marxist","su":"L'émancipation des travailleurs doit être l'œuvre des travailleurs eux-mêmes : ni sauveurs, ni tuteurs.","de":"Le principe ouvre les considérants des statuts de l'Association internationale des travailleurs, rédigés par Marx en 1864. Il s'oppose aussi bien aux philanthropes et aux socialistes utopiques qu'aux conspirateurs qui veulent agir à la place des masses. Flora Tristan appelait déjà en 1843 les ouvriers à s'unir par eux-mêmes.","ms":[{"st":"precursor","y":1843.0,"ds":"1843","w":"the-workers-union","p":["flora-tristan"]},{"st":"formulation","y":1864.7406,"ds":"28 sept. 1864","n":"1864-founding-of-the-first-international","p":["marx"],"note":"Considérants des statuts de l'AIT."}],"st":"draft"},{"id":"proletarian-internationalism","nm":"Internationalisme prolétarien","ty":"concept","tr":"marxist","su":"Les travailleurs n'ont pas de patrie : leur combat est international, comme le capital qu'ils affrontent.","de":"Le Manifeste conclut par l'appel « Prolétaires de tous les pays, unissez-vous ! ». La Ire Internationale, puis la IIe et la IIIe, tentent de lui donner une forme organisée. En août 1914, la plupart des partis de la IIe Internationale votent les crédits de guerre ; la minorité internationaliste se regroupe à Zimmerwald et prépare la fondation de l'Internationale communiste.","ap":"La théorie du socialisme dans un seul pays subordonne l'Internationale communiste aux intérêts diplomatiques de l'URSS, jusqu'à sa dissolution par Staline en 1943 en gage aux Alliés.","ms":[{"st":"formulation","y":1848.1233,"ds":"févr. 1848","w":"communist-manifesto"},{"st":"adoption","y":1864.7406,"ds":"28 sept. 1864","n":"1864-founding-of-the-first-international","o":["first-international"]},{"st":"adoption","y":1889.5356,"ds":"14 juil. 1889","n":"1889-founding-of-the-second-international","o":["second-international"]},{"st":"test","y":1914.5916,"ds":"4 août 1914","n":"1914-spd-war-credits","note":"Faillite de la IIe Internationale."},{"st":"development","y":1915.6776,"ds":"5 sept. 1915","n":"1915-zimmerwald-conference"},{"st":"adoption","y":1919.1694,"ds":"2 mars 1919","n":"1919-founding-of-the-comintern","o":["comintern"]},{"st":"abandonment","y":1943.3717,"ds":"15 mai 1943","n":"1943-dissolution-of-the-comintern"}],"st":"draft"},{"id":"vanguard-party","nm":"Parti d'avant-garde","ty":"theory","tr":"marxist","br":["bolshevism"],"su":"Parti qui regroupe les éléments les plus conscients de la classe ouvrière pour l'organiser et la diriger dans la lutte pour le pouvoir.","de":"Dans Que faire ?, Lénine soutient que la conscience socialiste ne naît pas spontanément de la lutte économique et doit être apportée dans la classe par un parti de révolutionnaires professionnels, centralisé pour résister à la police tsariste. La question des statuts du parti provoque en 1903 la scission entre bolcheviks et mencheviks. Les 21 conditions de 1920 en font la norme des partis communistes.","ap":"Ses adversaires y voient la source de la dictature du parti ; ses défenseurs rappellent que le parti bolchevik de 1917 vit de débats ouverts et que l'avant-garde ne prend le pouvoir qu'en gagnant la majorité de la classe. La caricature bureaucratique du stalinisme en est la négation.","ms":[{"st":"precursor","y":1847.0,"ds":"1847","o":["communist-league"]},{"st":"formulation","y":1902.2067,"ds":"mars 1902","w":"what-is-to-be-done","p":["lenin"]},{"st":"test","y":1903.5795,"ds":"30 juil. 1903","n":"1903-rsdlp-second-congress"},{"st":"adoption","y":1920.6233,"ds":"août 1920","w":"twenty-one-conditions","o":["comintern"]}],"st":"draft"},{"id":"democratic-centralism","nm":"Centralisme démocratique","ty":"concept","tr":"marxist","br":["vanguard-party"],"su":"Liberté de discussion dans le parti, unité dans l'action une fois la décision prise à la majorité.","de":"Le principe est inscrit dans les statuts du POSDR au congrès d'unification de 1906, avec l'accord des bolcheviks et des mencheviks. Il combine l'élection des instances, le débat libre et l'obligation pour la minorité d'appliquer les décisions de la majorité. L'Internationale communiste en fait une règle pour ses sections en 1920. En 1921, en pleine crise, le Xe congrès du parti russe interdit les fractions, mesure présentée comme temporaire.","ap":"Sous Staline, le principe devient centralisme bureaucratique : la discussion disparaît, seule reste la discipline imposée d'en haut.","ms":[{"st":"adoption","y":1906.3103,"ds":"23 avr. 1906","n":"1906-rsdlp-fourth-congress","o":["rsdlp"]},{"st":"adoption","y":1920.6233,"ds":"août 1920","w":"twenty-one-conditions","o":["comintern"]},{"st":"revision","y":1921.1858,"ds":"8 mars 1921","n":"1921-tenth-party-congress","note":"Interdiction des fractions."},{"st":"critique","y":1923.7884,"ds":"15 oct. 1923","n":"1923-declaration-of-the-46","note":"L'Opposition réclame le retour à la démocratie interne."}],"st":"draft"},{"id":"mass-strike","nm":"Grève de masse","al":["Grève générale","General strike","Generalstreik"],"ty":"strategy","tr":"marxist","su":"Mobilisation de toute la classe ouvrière par la grève, qui pose la question du pouvoir.","de":"Les chartistes anglais envisagent un « mois sacré » de grève générale ; en 1842, une vague de grèves gagne le nord de l'Angleterre. Anarchistes et syndicalistes révolutionnaires en font l'arme de la révolution sociale. Engels critique en 1873 la grève générale conçue comme recette. Après 1905, Rosa Luxemburg montre que la grève de masse n'est pas une technique qu'on déclenche à volonté, mais la forme même de la révolution prolétarienne, qui mêle revendications économiques et politiques.","ms":[{"st":"precursor","y":1842.5466,"ds":"18 juil. 1842","n":"1842-general-strike"},{"st":"critique","y":1873.0,"ds":"1873","p":["engels"],"note":"Les bakouninistes à l'œuvre, sur le soulèvement espagnol de 1873."},{"st":"test","y":1905.0575,"ds":"22 janv. 1905","n":"1905-russian-revolution"},{"st":"formulation","y":1906.0,"ds":"1906","w":"the-mass-strike","p":["rosa-luxemburg"]},{"st":"adoption","y":1906.7692,"ds":"8 oct. 1906","n":"1906-charter-of-amiens"}],"st":"draft"},{"id":"revolutionary-defeatism","nm":"Défaitisme révolutionnaire","ty":"strategy","tr":"marxist","br":["proletarian-internationalism"],"su":"Dans une guerre impérialiste, les révolutionnaires combattent leur propre gouvernement : l'ennemi principal est dans notre propre pays.","de":"Face à la guerre de 1914, Lénine refuse toute défense nationale : la défaite de son propre gouvernement facilite la révolution, et il faut transformer la guerre impérialiste en guerre civile contre la bourgeoisie. Karl Liebknecht, seul député à voter contre les crédits de guerre en décembre 1914, résume la même idée : l'ennemi principal est dans notre propre pays. La gauche de Zimmerwald regroupe les partisans de cette ligne.","ms":[{"st":"emergence","y":1914.9194,"ds":"2 déc. 1914","n":"1914-liebknecht-votes-against-war-credits","p":["karl-liebknecht"]},{"st":"formulation","y":1915.6233,"ds":"août 1915","w":"socialism-and-war","p":["lenin","zinoviev"]},{"st":"test","y":1915.6776,"ds":"5 sept. 1915","n":"1915-zimmerwald-conference","note":"La gauche de Zimmerwald."}],"st":"draft"},{"id":"national-self-determination","nm":"Droit des nations à disposer d'elles-mêmes","ty":"concept","tr":"marxist","su":"Droit des peuples opprimés à se séparer et à former leur propre État, que la classe ouvrière de la nation dominante doit défendre.","de":"Inscrit dans le programme du POSDR en 1903, il est défendu par Lénine contre Rosa Luxemburg, qui y voit une concession au nationalisme. Pour Lénine, reconnaître ce droit sans réserve est la condition pour unir les travailleurs des nations dominantes et opprimées, ce qui n'implique pas de prôner la séparation dans chaque cas. En 1916, il défend l'insurrection irlandaise de Pâques contre ceux qui la traitent de putsch. Après Octobre, le pouvoir soviétique reconnaît l'indépendance de la Finlande.","ms":[{"st":"adoption","y":1903.0,"ds":"1903","o":["rsdlp"],"note":"Point 9 du programme adopté au IIe congrès."},{"st":"critique","y":1908.0,"ds":"1908","p":["rosa-luxemburg"],"note":"« La question nationale et l'autonomie » (1908-1909)."},{"st":"formulation","y":1914.0,"ds":"1914","w":"the-right-of-nations-to-self-determination","p":["lenin"]},{"st":"test","y":1916.313,"ds":"24 avr. 1916","w":"proclamation-of-the-irish-republic","note":"Lénine défend l'insurrection de Pâques."},{"st":"test","y":1917.9304,"ds":"6 déc. 1917","n":"1917-finnish-independence"}],"st":"draft"},{"id":"united-front","nm":"Front unique","ty":"strategy","tr":"marxist","su":"Unité d'action des organisations ouvrières pour des objectifs communs, sans renoncer à la critique ni à l'indépendance du parti révolutionnaire.","de":"Adoptée par l'Internationale communiste fin 1921, quand le reflux révolutionnaire laisse la majorité des ouvriers aux partis sociaux-démocrates. Les communistes proposent aux réformistes des actions communes sur des revendications concrètes, pour gagner leur base par l'expérience. Abandonnée en 1928 pour la ligne « classe contre classe », qui qualifie la social-démocratie de « social-fascisme », elle est défendue par Trotski comme le seul moyen d'arrêter Hitler.","ap":"Le refus du front unique par les directions du KPD et du SPD divise la classe ouvrière allemande face au nazisme : l'arrivée de Hitler au pouvoir en 1933, sans combat, en est la conséquence.","ms":[{"st":"formulation","y":1921.9567,"ds":"déc. 1921","o":["comintern"],"note":"Thèses du comité exécutif de l'IC sur le front unique."},{"st":"adoption","y":1922.8443,"ds":"5 nov. 1922","n":"1922-fourth-comintern-congress","o":["comintern"]},{"st":"abandonment","y":1927.8553,"ds":"9 nov. 1927","n":"1927-class-against-class"},{"st":"development","y":1931.9567,"ds":"déc. 1931","p":["trotsky"],"note":"« Pour un front unique ouvrier contre le fascisme »."},{"st":"test","y":1933.0795,"ds":"30 janv. 1933","n":"1933-hitler-appointed-chancellor"}],"st":"draft"},{"id":"popular-front","nm":"Front populaire","ty":"strategy","tr":"marxist","su":"Alliance des partis ouvriers avec des partis bourgeois « démocratiques » sur un programme limité au cadre capitaliste.","de":"Après la victoire de Hitler, l'Internationale communiste passe de « classe contre classe » à l'alliance avec les partis bourgeois antifascistes. En France, le pacte d'unité d'action PCF-SFIO de 1934 s'élargit aux radicaux et mène à la victoire électorale de 1936 ; en Espagne, le Front populaire gagne les élections de février 1936. Le programme exclut toute mesure contre la propriété capitaliste.","ap":"Pour Trotski, le front populaire n'est pas un front unique élargi mais une coalition de collaboration de classes, qui lie la classe ouvrière à la bourgeoisie au moment où la situation devient révolutionnaire : en France, le PCF freine la grève de juin 1936 ; en Espagne, la politique du Front populaire désarme la révolution.","ms":[{"st":"emergence","y":1934.5712,"ds":"27 juil. 1934","n":"1934-unity-of-action-pact"},{"st":"critique","y":1934.8733,"ds":"nov. 1934","w":"whither-france","p":["trotsky"]},{"st":"adoption","y":1935.5658,"ds":"25 juil. 1935","n":"1935-seventh-comintern-congress","o":["comintern"]},{"st":"test","y":1936.3185,"ds":"26 avr. 1936","n":"1936-popular-front-election"},{"st":"test","y":1936.5493,"ds":"19 juil. 1936","n":"1936-spanish-revolution"}],"st":"draft"},{"id":"transitional-programme","nm":"Programme de transition","ty":"strategy","tr":"marxist","br":["trotskyism"],"su":"Système de revendications qui partent des besoins immédiats des masses pour les conduire à la conclusion de la prise du pouvoir.","de":"Contre la division social-démocrate entre programme minimum, fait de réformes, et programme maximum, le socialisme renvoyé à un avenir lointain, Trotski propose en 1938 des revendications de transition : échelle mobile des salaires et des heures de travail, contrôle ouvrier, ouverture des livres de comptes, expropriation des banques, milices ouvrières. L'idée remonte aux mesures du Manifeste et aux débats du IVe congrès de l'Internationale communiste.","ms":[{"st":"precursor","y":1848.1233,"ds":"févr. 1848","w":"communist-manifesto","note":"Mesures du chapitre II."},{"st":"emergence","y":1922.8443,"ds":"5 nov. 1922","n":"1922-fourth-comintern-congress"},{"st":"formulation","y":1938.0,"ds":"1938","w":"transitional-programme","p":["trotsky"]},{"st":"adoption","y":1938.6721,"ds":"3 sept. 1938","n":"1938-founding-of-the-fourth-international","o":["fourth-international"]}],"st":"draft"},{"id":"socialism-in-one-country","nm":"Socialisme dans un seul pays","ty":"theory","tr":"marxist","br":["stalinism"],"su":"Thèse de Staline selon laquelle le socialisme peut être achevé en URSS seule, sans révolution internationale.","de":"Avancée par Staline fin 1924, contre la conception de Lénine et de Trotski qui faisaient dépendre l'issue de la révolution russe de son extension à l'Europe avancée. Adoptée par la XIVe conférence du parti en 1925, puis par le programme de l'Internationale communiste en 1928, elle subordonne les partis communistes à la défense de l'URSS.","ap":"Pour Trotski, elle exprime le conservatisme d'une bureaucratie qui veut jouir en paix de ses privilèges : en faisant de la révolution mondiale un simple appoint, elle transforme l'Internationale en instrument de la diplomatie soviétique.","ms":[{"st":"formulation","y":1924.9567,"ds":"déc. 1924","n":"1924-socialism-in-one-country","p":["stalin"]},{"st":"adoption","y":1925.29,"ds":"avr. 1925","o":["cpsu"],"note":"XIVe conférence du parti."},{"st":"critique","y":1928.0,"ds":"1928","w":"the-third-international-after-lenin","p":["trotsky"],"note":"Critique du projet de programme de l'IC, rédigée pour le VIe congrès, publiée en 1929."},{"st":"adoption","y":1928.7067,"ds":"sept. 1928","o":["comintern"],"note":"Programme adopté au VIe congrès de l'IC."}],"st":"draft"},{"id":"hegemony","nm":"Hégémonie","ty":"concept","tr":"marxist","su":"Direction exercée par une classe sur les autres classes exploitées, par le consentement autant que par la force.","de":"Dans la social-démocratie russe, l'« hégémonie du prolétariat » désigne la direction que la classe ouvrière doit exercer sur la paysannerie et les couches démocratiques dans la révolution contre le tsarisme. En prison, Gramsci élargit la notion : en Occident, la bourgeoisie domine aussi par un consentement organisé dans la société civile (école, presse, Église, syndicats), ce qui impose au parti révolutionnaire une longue « guerre de position ».","ap":"Après la guerre, les dirigeants du PCI puis l'eurocommunisme invoquent Gramsci pour justifier une voie parlementaire et graduelle ; ses défenseurs révolutionnaires rappellent qu'il restait léniniste et partisan de la prise du pouvoir.","ms":[{"st":"emergence","y":1905.0,"ds":"1905","p":["plekhanov","axelrod","martov","lenin"],"note":"Usage dans la social-démocratie russe ; date de première apparition à vérifier."},{"st":"development","y":1911.0,"ds":"1911","p":["lenin"],"note":"« Le marxisme et Nacha Zaria »."},{"st":"formulation","y":1929.0,"ds":"1929","w":"prison-notebooks","p":["antonio-gramsci"],"note":"Rédigés de 1929 à 1935, publiés de 1948 à 1951."}],"st":"draft"},{"id":"new-democracy","nm":"Démocratie nouvelle","ty":"theory","tr":"marxist","br":["maoism","stages-theory"],"su":"Théorie maoïste d'une révolution en deux temps : d'abord un État de bloc de classes sous direction du parti communiste, puis le socialisme.","de":"Mao la formule en 1940 : la révolution chinoise, antiféodale et anti-impérialiste, doit unir ouvriers, paysans, petite bourgeoisie et bourgeoisie nationale sous la direction du PCC, et laisser subsister un temps le capitalisme. Le Programme commun de 1949 en fait la base de la République populaire. Dès 1953, la « ligne générale de la période de transition » engage la socialisation, achevée en 1956.","ap":"Variante maoïste de la théorie des étapes. Les événements la démentent en partie : dès 1952-1956, le régime exproprie la bourgeoisie nationale, ce qui montre qu'aucune étape capitaliste stable n'était possible, mais il le fait d'en haut, sans pouvoir ouvrier.","ms":[{"st":"formulation","y":1940.04,"ds":"janv. 1940","w":"on-new-democracy","p":["mao-zedong"]},{"st":"adoption","y":1949.7215,"ds":"21 sept. 1949","n":"1949-cppcc-and-common-program"},{"st":"abandonment","y":1956.04,"ds":"janv. 1956","n":"1956-socialist-transformation-of-industry"}],"st":"draft"},{"id":"rights-of-man","nm":"Droits de l'homme","ty":"concept","tr":"democratic","su":"Droits naturels proclamés par la révolution bourgeoise : liberté, propriété, sûreté, résistance à l'oppression, égalité devant la loi.","de":"La Déclaration des droits de l'homme et du citoyen de 1789 consacre l'égalité juridique, la souveraineté de la nation et la propriété comme droit inviolable et sacré. Thomas Paine les défend contre Burke en 1791. Elles deviennent le langage universel des révolutions démocratiques, mais aussi des esclaves de Saint-Domingue et des femmes qui en réclament l'application.","ap":"Marx salue le progrès historique de l'émancipation politique, mais montre qu'elle laisse intacte l'inégalité sociale : la liberté et l'égalité proclamées restent formelles tant que subsiste la propriété privée des moyens de production.","ms":[{"st":"formulation","y":1789.6518,"ds":"26 août 1789","n":"1789-declaration-of-the-rights-of-man"},{"st":"development","y":1791.2067,"ds":"mars 1791","w":"rights-of-man","p":["thomas-paine"]}],"st":"draft"},{"id":"womens-emancipation","nm":"Émancipation des femmes","ty":"concept","tr":"marxist","su":"Libération des femmes de l'oppression, que le marxisme lie à l'abolition de la propriété privée et à la socialisation du travail domestique.","de":"Olympe de Gouges réclame en 1791 l'égalité des droits pour les femmes ; en 1848, la convention de Seneca Falls l'exige aux États-Unis. Bebel puis Engels rattachent l'oppression des femmes à l'apparition de la propriété privée et de la famille patriarcale. Le mouvement socialiste crée une Journée internationale des femmes en 1910 ; le 8 mars 1917, la grève des ouvrières de Petrograd ouvre la révolution de Février. Le pouvoir soviétique légalise le divorce et l'avortement, avant que Staline ne revienne sur ces conquêtes.","ms":[{"st":"precursor","y":1791.7067,"ds":"sept. 1791","note":"Olympe de Gouges, Déclaration des droits de la femme et de la citoyenne."},{"st":"precursor","y":1848.5493,"ds":"19 juil. 1848","w":"declaration-of-sentiments"},{"st":"formulation","y":1879.0,"ds":"1879","w":"woman-and-socialism","p":["august-bebel"]},{"st":"development","y":1884.0,"ds":"1884","w":"origin-of-the-family","p":["engels"]},{"st":"adoption","y":1910.6233,"ds":"août 1910","p":["clara-zetkin"],"note":"La conférence internationale des femmes socialistes de Copenhague décide une Journée internationale des femmes."},{"st":"test","y":1917.1858,"ds":"8 mars 1917","n":"1917-international-womens-day-strike"},{"st":"revision","y":1936.4879,"ds":"27 juin 1936","n":"1936-soviet-abortion-ban"}],"st":"draft"},{"id":"economic-liberalism","nm":"Libéralisme économique","ty":"theory","tr":"liberal","su":"Doctrine selon laquelle le libre jeu du marché et de la concurrence assure la prospérité générale, l'État se limitant à garantir la propriété et les contrats.","de":"Adam Smith montre que la division du travail et l'échange enrichissent les nations, et que la recherche de l'intérêt privé, guidée par une « main invisible », sert l'intérêt général. Ricardo y ajoute la théorie des avantages comparatifs, fondement du libre-échange. L'abolition des lois sur les blés en 1846 marque la victoire de la bourgeoisie industrielle britannique sur les propriétaires fonciers.","ap":"Marx reconnaît la valeur scientifique de l'économie classique, mais lui reproche de présenter comme naturelles et éternelles les lois d'une société historique, fondée sur l'exploitation du travail salarié.","ms":[{"st":"formulation","y":1776.1886,"ds":"9 mars 1776","w":"the-wealth-of-nations","p":["adam-smith"]},{"st":"development","y":1817.0,"ds":"1817","w":"principles-of-political-economy-ricardo","p":["david-ricardo"]},{"st":"adoption","y":1846.4567,"ds":"juin 1846","n":"1846-corn-laws-repeal"}],"st":"draft"},{"id":"malthusianism","nm":"Malthusianisme","ty":"theory","tr":"conservative","su":"Thèse selon laquelle la population croît plus vite que les subsistances, si bien que la misère serait une loi naturelle et non un produit social.","de":"Malthus soutient que la population tend à croître de façon géométrique et les subsistances de façon arithmétique ; l'assistance aux pauvres ne ferait qu'augmenter leur nombre et leur misère. Ces idées inspirent la nouvelle loi sur les pauvres de 1834, qui enferme les indigents dans les workhouses.","ap":"Engels et Marx y voient une apologie de la bourgeoisie : la « surpopulation » n'est pas absolue mais relative aux besoins du capital, qui entretient une armée industrielle de réserve de chômeurs pour peser sur les salaires.","ms":[{"st":"formulation","y":1798.0,"ds":"1798","w":"essay-on-the-principle-of-population","p":["thomas-malthus"]},{"st":"adoption","y":1834.6189,"ds":"14 août 1834","n":"1834-new-poor-law"},{"st":"critique","y":1844.0,"ds":"1844","p":["engels"],"note":"Esquisse d'une critique de l'économie politique."}],"st":"draft"},{"id":"social-catholicism","nm":"Catholicisme social","al":["Doctrine sociale de l'Église"],"ty":"theory","tr":"religious","su":"Doctrine de l'Église catholique qui condamne à la fois le libéralisme sans frein et le socialisme, et prône la collaboration des classes.","de":"L'encyclique Rerum novarum de Léon XIII, en 1891, reconnaît la misère ouvrière et le droit d'association, mais défend la propriété privée comme droit naturel et rejette la lutte des classes. Quadragesimo anno, en 1931, promeut une organisation corporatiste de la société, dont se réclament des régimes autoritaires d'Autriche et du Portugal.","ap":"Pour le marxisme, c'est une réponse au développement du mouvement socialiste : détourner les travailleurs croyants de la lutte des classes vers des syndicats chrétiens et la collaboration avec le patronat.","ms":[{"st":"formulation","y":1891.3717,"ds":"15 mai 1891","w":"rerum-novarum"},{"st":"development","y":1931.3733,"ds":"mai 1931","note":"Encyclique Quadragesimo anno de Pie XI."}],"st":"draft"},{"id":"fascism","nm":"Fascisme","ty":"current","tr":"fascist","su":"Mouvement de masse contre-révolutionnaire, appuyé sur la petite bourgeoisie désespérée, qui écrase le mouvement ouvrier pour le compte du grand capital.","de":"Né en Italie en 1919 autour de Mussolini, il mobilise anciens combattants, petite bourgeoisie et déclassés contre la menace révolutionnaire du « biennio rosso », avec le soutien des industriels et des grands propriétaires. Arrivé au pouvoir en 1922, il détruit les organisations ouvrières et instaure un État totalitaire et corporatiste. Le nazisme en est la variante allemande, au pouvoir en 1933.","ap":"Pour Trotski, le fascisme est le dernier recours de la bourgeoisie quand la démocratie parlementaire ne suffit plus à contenir le prolétariat ; seule l'action unie de la classe ouvrière pouvait l'arrêter.","ms":[{"st":"emergence","y":1919.2067,"ds":"mars 1919","w":"il-popolo-d-italia","n":"1918-biennio-rosso-and-rise-of-fascism","p":["benito-muss
