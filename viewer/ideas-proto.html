olini"],"note":"Fondation des Faisceaux italiens de combat en mars 1919."},{"st":"test","y":1922.8322,"ds":"31 oct. 1922","n":"1922-fascist-regime"},{"st":"critique","y":1932.0,"ds":"1932","p":["trotsky"],"note":"Écrits de Trotski sur l'Allemagne."},{"st":"formulation","y":1932.0,"ds":"1932","p":["benito-mussolini"],"note":"La dottrina del fascismo, rédigée avec Giovanni Gentile."},{"st":"test","y":1933.0795,"ds":"30 janv. 1933","n":"1933-third-reich"},{"st":"critique","y":1935.5658,"ds":"25 juil. 1935","n":"1935-seventh-comintern-congress","p":["georgi-dimitrov"],"note":"Définition du fascisme comme dictature terroriste ouverte des éléments les plus réactionnaires du capital financier."}],"st":"draft"},{"id":"keynesianism","nm":"Keynésianisme","ty":"theory","tr":"liberal","su":"Politique économique qui confie à l'État la relance de la demande pour assurer le plein emploi, sans toucher à la propriété capitaliste.","de":"Après la crise de 1929, Keynes rejette l'idée que le marché revient spontanément au plein emploi : l'État doit soutenir la demande par la dépense publique et la politique monétaire. Après 1945, ces idées inspirent l'État-providence, le système de Bretton Woods et la croissance d'après-guerre. La stagflation des années 1970 provoque leur abandon.","ap":"Le marxisme y voit une tentative de sauver le capitalisme de ses crises par le crédit et la dette publique, possible pendant l'exceptionnelle croissance d'après-guerre, mais qui ne supprime pas la contradiction entre production et marché : elle la reporte, au prix de l'inflation.","ms":[{"st":"formulation","y":1936.1233,"ds":"févr. 1936","w":"the-general-theory","p":["john-maynard-keynes"]},{"st":"adoption","y":1942.0,"ds":"1942","w":"beveridge-report"},{"st":"adoption","y":1944.5,"ds":"1 juil. 1944","n":"1944-bretton-woods-conference"},{"st":"abandonment","y":1976.0,"ds":"1976","n":"1976-imf-crisis","p":["james-callaghan"],"note":"Callaghan déclare au congrès travailliste qu'on ne peut plus sortir d'une récession en dépensant."}],"st":"draft"},{"id":"neoliberalism","nm":"Néolibéralisme","ty":"theory","tr":"liberal","su":"Doctrine qui veut restaurer le marché contre l'intervention de l'État : privatisations, déréglementation, lutte contre l'inflation et contre les syndicats.","de":"Le terme est adopté en 1938 par des libéraux réunis à Paris. Hayek dénonce toute planification comme la « route de la servitude » et fonde en 1947 la Société du Mont-Pèlerin. Marginal pendant l'après-guerre keynésien, le courant triomphe avec la crise des années 1970 : Chili de Pinochet et des « Chicago Boys », Thatcher, Reagan, puis « consensus de Washington » imposé aux pays endettés.","ap":"Pour le marxisme, le néolibéralisme est l'offensive de la classe capitaliste pour restaurer le taux de profit après la fin de l'essor d'après-guerre, en démantelant les conquêtes ouvrières ; il a d'abord été imposé par une dictature militaire, au Chili.","ms":[{"st":"emergence","y":1938.6518,"ds":"26 août 1938","n":"1938-walter-lippmann-colloquium"},{"st":"formulation","y":1944.2067,"ds":"mars 1944","w":"the-road-to-serfdom","p":["friedrich-hayek"]},{"st":"adoption","y":1947.25,"ds":"1 avr. 1947","n":"1947-founding-of-the-mont-pelerin-society","o":["mont-pelerin-society"]},{"st":"test","y":1973.6941,"ds":"11 sept. 1973","n":"1973-chilean-coup"},{"st":"adoption","y":1979.3416,"ds":"4 mai 1979","n":"1979-thatcherism"}],"st":"draft"}],"nodes":{"1914-lenin-swiss-exile":{"t":"Exil de Lénine en Suisse","ty":"exile","s":1914.6776,"e":1917.2719,"ds":"5 sept. 1914","de":"9 avr. 1917","su":"Arrivé de Galicie autrichienne au début de la guerre, Lénine s'installe à Berne, puis à Zurich en 1916, jusqu'à son départ pour la Russie en avril 1917.","la":["bo"],"rt":"bolshevism","pa":["1914-war-years","1914-first-world-war-and-general-strike"],"pe":["lenin"]},"1827-mechanics-union-of-trade-associations-founding":{"t":"Fondation de l'Union des associations de métiers","ty":"founding","s":1827.0,"ds":"1827","su":"Le function glyph(shape,x,y,r,fill,stroke,extra=""){
  const a=`fill="${fill}" stroke="${stroke}" ${extra}`;
  switch(shape){
    case "dot": return `<circle cx="${x}" cy="${y}" r="${r*.8}" ${a}/>`;
    case "big": return `<circle cx="${x}" cy="${y}" r="${r*1.15}" ${a} stroke-width="2"/>`;
    case "ring": return `<circle cx="${x}" cy="${y}" r="${r*.75}" fill="var(--card)" stroke="${fill==="none"?stroke:fill}" stroke-width="1.6" ${extra}/>`;
    case "square": return `<rect x="${x-r*.75}" y="${y-r*.75}" width="${r*1.5}" height="${r*1.5}" ${a}/>`;
    case "diamond": return `<path d="M${x},${y-r} L${x+r},${y} L${x},${y+r} L${x-r},${y}Z" ${a}/>`;
    case "diamondO": return `<path d="M${x},${y-r} L${x+r},${y} L${x},${y+r} L${x-r},${y}Z" fill="var(--card)" stroke="${fill}" stroke-width="1.6" ${extra}/>`;
    case "triUp": return `<path d="M${x},${y-r} L${x+r},${y+r*.8} L${x-r},${y+r*.8}Z" ${a}/>`;
    case "triDown": return `<path d="M${x},${y+r} L${x+r},${y-r*.8} L${x-r},${y-r*.8}Z" ${a}/>`;
    case "cross": return `<g ${extra}><path d="M${x-r*.8},${y-r*.8} L${x+r*.8},${y+r*.8} M${x+r*.8},${y-r*.8} L${x-r*.8},${y+r*.8}" stroke="${fill}" stroke-width="2.4" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${r}" fill="transparent" stroke="none"/></g>`;
    case "slash": return `<g ${extra}><circle cx="${x}" cy="${y}" r="${r*.85}" fill="var(--card)" stroke="${fill}" stroke-width="1.6"/><path d="M${x-r*.6},${y+r*.6} L${x+r*.6},${y-r*.6}" stroke="${fill}" stroke-width="1.8"/></g>`;
    case "star": { let d=""; for(let i=0;i<10;i++){const rr=i%2?r*.45:r*1.05, an=-Math.PI/2+i*Math.PI/5; d+=(i?"L":"M")+(x+rr*Math.cos(an)).toFixed(1)+","+(y+rr*Math.sin(an)).toFixed(1);} return `<path d="${d}Z" ${a}/>`; }
    default: return `<circle cx="${x}" cy="${y}" r="${r*.6}" ${a}/>`;
  }
}

}

function worksIdeas(wid){ const out=[]; IDEAS.forEach(d=>d.ms.forEach(m=>{ if(m.w===wid) out.push({...m,idea:d.id}); })); return out; }

const det=document.getElementById("detail");
function closeDetail(){ det.classList.remove("open"); S.sel=null; renderCurrent(); }
function laneTag(k){ const l=LANE[k]; return `<span class="lt" style="background:${l.c}">${l.l}</span>`; }
function msRow(m,withIdea){

    ${m.note?`<div class="nt">${esc(m.note)}</div>`:""}</div>`;
}
function openDetail(kind,id,extra){
  S.sel={kind,id}; let h="";

      ${n.su?`<p>${esc(n.su)}</p>`:""}
      <h4>Idées en jeu (${ii.length})</h4>${ii.length?ii.map(x=>msRow(x.m,true)).join(""):`<p class="hint">Aucun jalon d'idée ne pointe sur cet évènement.</p>`}

      ${n.pe?`<h4>Personnes</h4><div class="chips">${n.pe.map(p=>P[p]?`<span class="chip" data-k="person" data-id="${p}">${esc(P[p].t)}</span>`:"").join("")}</div>`:""}`;

    h=bar("Croisement")+`<h2>${esc(d.nm)}</h2><div class="meta">× ${root==="_"?"sans évènement":esc(DATA.roots[root]?.t||root)}</div>${ms.map(m=>msRow(m,false)).join("")}

det.addEventListener("click",e=>{

// ───────────────────────── vue 1 : frise & idées ─────────────────────────
const sc1=document.getElementById("sc1"), sv1=document.getElementById("sv1"), ax1=document.getElementById("ax1");
const G=200; // gouttière des libellés
let V1 = {nodesPos:{}, ideaY:{}, width:0};
function xOf(y,w){ return G + (y-S.t0)/(S.t1-S.t0)*(w-G-24); }
function tickStep(span,w){ const per=span/(w/70); for(const s of [1,2,5,10,20,25,50,100]) if(s>=per) return s; return 100; }
function visibleIdeas(){
  let list=IDEAS.filter(d=>!S.tradOff.has(d.tr||"other"));
  if (S.filter==="touch") list=list.filter(d=>ideaLanes(d).size);
  return list;
}
function groupedIdeas(list){
  const set=new Set(list.map(d=>d.id)); const out=[];
  const start=d=>milestones(d)[0]?.y??9999;
  if (S.group==="tradition"){ for(const k of Object.keys(TRAD)){ const g=list.filter(d=>(d.tr||"other")===k).sort((a,b)=>start(a)-start(b)); if(g.length){ out.push({h:TRAD[k].l}); g.forEach(d=>out.push({d,lv:0})); } } }
  else if (S.group==="type"){ for(const k of Object.keys(TYPES)){ const g=list.filter(d=>d.ty===k).sort((a,b)=>start(a)-start(b)); if(g.length){ out.push({h:TYPES[k]}); g.forEach(d=>out.push({d,lv:0})); } } }
  else { // arbre
    const seen=new Set();
    const roots=list.filter(d=>!(d.br||[]).some(b=>set.has(b))).sort((a,b)=>start(a)-start(b));
    const walk=(d,lv)=>{ if(seen.has(d.id))return; seen.add(d.id); out.push({d,lv}); (CHILDREN[d.id]||[]).filter(c=>set.has(c)).map(c=>I[c]).sort((a,b)=>start(a)-start(b)).forEach(c=>walk(c,lv+1)); };
    out.push({h:"Arbre « plus général → plus précis »"}); roots.forEach(d=>walk(d,0));
  }
  return out;
}
function renderV1(){
  const w=sc1.clientWidth; if(w<G+100) return; V1.width=w; V1.nodesPos={}; V1.ideaY={};
  const k=(w-G-24)/(S.t1-S.t0); // px par an
  const X=y=>xOf(y,w);
  const sel=S.sel, hov=S.hov;
  // axe
  const step=tickStep(S.t1-S.t0,w-G); let ax=`<rect x="0" y="0" width="${G}" height="26" fill="var(--paper)"/>`;
  for(let y=Math.ceil(S.t0/step)*step;y<=S.t1;y+=step){ const x=X(y); if(x<G)continue; ax+=`<line x1="${x}" x2="${x}" y1="18" y2="26" stroke="var(--faint)"/><text x="${x+3}" y="16" class="lblm">${y}</text>`; }
  ax1.setAttribute("width",w); ax1.innerHTML=ax;
  let s="", top=8, grid="";
  for(let y=Math.ceil(S.t0/step)*step;y<=S.t1;y+=step){ const x=X(y); if(x>=G) grid+=`<line x1="${x}" x2="${x}" y1="0" y2="100%" stroke="#ddd5c5" stroke-width="0.6"/>`; }
  // idées affichées et ensembles de surlignage
  const list=visibleIdeas(), rows=groupedIdeas(list);
  const selIdea = sel&&sel.kind==="idea"?sel.id:null, selNode = sel&&sel.kind==="node"?sel.id:null;
  const hotIdeas=new Set(), hotNodes=new Set();
  const focusIdea = (hov&&hov.kind==="idea")?hov.id:selIdea;
  if (focusIdea) milestones(I[focusIdea]).forEach(m=>targets(m).forEach(t=>hotNodes.add(t.n)));
  const focusNode = (hov&&hov.kind==="node")?hov.id:selNode;
  if (focusNode){ hotNodes.add(focusNode); ideasOfNode(focusNode).forEach(x=>hotIdeas.add(x.d.id)); }
  if (focusIdea) hotIdeas.add(focusIdea);
  const dimming = hotIdeas.size>0 || hotNodes.size>0;
  // nœuds-ponts (cibles de jalons visibles)
  const bridge={}; list.forEach(d=>milestones(d).forEach(m=>targets(m).forEach(t=>{ (bridge[t.n]=bridge[t.n]||[]).push(d); })));
  // ── lignes pays
  let lanesSvg="";
  for (const L of LANES){
    const nodes=Object.entries(N).filter(([id,n])=>n.la&&n.la.includes(L.k)&&n.s!=null);
    const root=N[L.root];
    const y0=top, h=L.h;
    lanesSvg+=`<rect x="${G}" y="${y0}" width="${w-G}" height="${h}" fill="${L.c}" opacity="0.035"/>`;
    if(root){ const x1=Math.max(G,X(root.s)), x2=Math.min(w,X(root.e||2026.8)); if(x2>x1) lanesSvg+=`<rect x="${x1}" y="${y0}" width="${x2-x1}" height="${h}" fill="${L.c}" opacity="0.05"/>`; }
    lanesSvg+=`<line x1="0" x2="${w}" y1="${y0+h}" y2="${y0+h}" stroke="var(--rule)"/>`;
    // périodes
    const per=nodes.filter(([id,n])=>(n.ty==="period")&&n.e).sort((a,b)=>a[1].s-b[1].s);
    const prow=[]; let pH=0;
    for(const [id,n] of per){ const x1=X(n.s), x2=X(n.e); if(x2<G||x1>w) continue; let r=0; while(prow[r]!=null&&prow[r]>x1-1) r++; prow[r]=x2; const yy=y0+4+r*14; pH=Math.max(pH,(r+1)*14);
      const cx1=Math.max(x1,G), wd=Math.max(2,Math.min(x2,w)-cx1);
      lanesSvg+=`<g class="hot" data-k="node" data-id="${id}"><rect x="${cx1}" y="${yy}" width="${wd}" height="11" rx="2" fill="${L.c}" opacity="${dimming&&!hotNodes.has(id)?0.1:0.22}"/>${wd>60?`<text x="${cx1+4}" y="${yy+9}" class="lblm" style="font-size:9.5px">${esc(fit(n.t,wd-8,5.4))}</text>`:""}</g>`; }
    // évènements
    const evTop=y0+8+pH, rowH=15, nRows=Math.max(3,Math.floor((y0+h-evTop-6)/rowH));
    const evs=nodes.filter(([id,n])=>n.ty!=="period"&&n.ty!=="era"&&X(n.s)>=G-2&&X(n.s)<=w+2);
    const occ=Array.from({length:nRows},()=>[]);
    const free=(r,a,b)=>occ[r].every(([p,q])=>b<p||a>q);
    const placeOrder=[...evs].sort((a,b)=>((bridge[b[0]]?1:0)-(bridge[a[0]]?1:0))||(a[1].s-b[1].s));
    for(const [id,n] of placeOrder){
      const x=X(n.s), lw=Math.min(n.t.length*5.9,220)+6; let r=-1, lab=false;
      if (k>4) for(let i=0;i<nRows;i++) if(free(i,x-5,x+8+lw)){ r=i; lab=true; break; }
      if (r<0) for(let i=0;i<nRows;i++) if(free(i,x-5,x+5)){ r=i; break; }
      if (r<0) r=nRows-1;
      occ[r].push([x-5,lab?x+8+lw:x+5]);
      const yy=evTop+r*rowH+7; V1.nodesPos[id]={x,y:yy,lane:L.k};
      const isB=!!bridge[id], hot=hotNodes.has(id), dim=dimming&&!hot;
      const col=L.c;
      lanesSvg+=`<g class="hot" data-k="node" data-id="${id}" opacity="${dim?0.22:1}">`+
        (isB?`<circle cx="${x}" cy="${yy}" r="${hot?8.5:7}" fill="none" stroke="${tradOf(bridge[id][0]).c}" stroke-width="${hot?2:1.2}" opacity="${hot?1:.7}"/>`:"")+
        glyph(FAM[n.ty]||"dot",x,yy,4.6,col,"var(--card)")+
        (lab?`<text x="${x+8}" y="${yy+3.6}" class="lbl" ${isB||hot?'font-weight="600"':""}>${esc(fit(n.t,lw-6,5.9))}</text>`:"")+`</g>`;
    }
    // libellé de gouttière
    lanesSvg+=`<rect x="0" y="${y0}" width="${G}" height="${h}" fill="var(--paper)"/><rect x="0" y="${y0}" width="4" height="${h}" fill="${L.c}"/>
      <text x="14" y="${y0+20}" style="font:600 15px var(--serif)" fill="${L.c}">${L.l}</text>
      <text x="14" y="${y0+37}" class="lblm">${nodes.length} évènements</text>
      <text x="14" y="${y0+51}" class="lblm">${Object.keys(bridge).filter(id=>N[id].la&&N[id].la.includes(L.k)).length} reliés à des idées (cerclés)</text>`;
    top+=h+6;
  }
  // ── idées
  top+=10;
  let ideasSvg=`<text x="14" y="${top+14}" style="font:600 15px var(--serif)">Idées</text><text x="64" y="${top+14}" class="lblm">${list.length} affichées sur ${IDEAS.length}</text>`;
  top+=26;
  const RH=24;
  for(const row of rows){
    if(row.h){ ideasSvg+=`<text x="14" y="${top+13}" class="grp">${esc(row.h)}</text><line x1="${G}" x2="${w}" y1="${top+9}" y2="${top+9}" stroke="var(--rule)" stroke-dasharray="2 3"/>`; top+=20; continue; }
    const d=row.d, col=tradOf(d).c, ms=milestones(d), yy=top+RH/2; V1.ideaY[d.id]=yy;
    const hot=hotIdeas.has(d.id), dim=dimming&&!hot;
    const xs=ms.filter(m=>m.y!=null).map(m=>X(m.y));
    let g=`<g opacity="${dim?0.25:1}">`;
    if (hot) g+=`<rect x="${G}" y="${top+1}" width="${w-G}" height="${RH-2}" fill="${col}" opacity="0.06"/>`;
    if (xs.length){ const a=Math.max(G,Math.min(...xs)), b=Math.min(w,Math.max(...xs)); if(b>a) g+=`<line x1="${a}" x2="${b}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="${hot?3:2}" opacity="0.55" stroke-linecap="round"/>`;
      const last=ms[ms.length-1]; if(last&&last.st!=="abandonment"&&Math.max(...xs)<w){ const bx=Math.max(G,Math.max(...xs)); g+=`<line x1="${bx}" x2="${Math.min(w,bx+30)}" y1="${yy}" y2="${yy}" stroke="${col}" stroke-width="2" opacity="0.3" stroke-dasharray="2 3"/>`; } }
    ms.forEach((m,i)=>{ if(m.y==null)return; const x=X(m.y); if(x<G-6||x>w+6)return; g+=`<g class="hot" data-k="ms" data-i="${d.id}" data-j="${i}">${stageGlyph(m,x,yy,m.st==="formulation"?6:5.2,col)}</g>`; });
    g+="</g>";
    const ind=row.lv*12;
    g+=`<rect x="0" y="${top}" width="${G}" height="${RH}" fill="var(--paper)"/>`+
       `<g class="hot" data-k="idea" data-id="${d.id}" opacity="${dim?0.4:1}"><circle cx="${14+ind}" cy="${yy}" r="4" fill="${col}"/>`+
       `<text x="${24+ind}" y="${yy+4}" class="gut" ${hot?'font-weight="700"':""}>${esc(fit(d.nm,G-34-ind,6.6))}</text>`+

  <h3>États-Unis × Bolchevisme : ce que disent les données</h3>
  <p>Les deux lignes ne partagent <b>aucune personne ni organisation</b>, et les deux seuls liens directs passent par la Première Guerre mondiale. Sans les idées, elles restent deux histoires parallèles. Les jalons d'idées créent les ponts : <b>${nBridge}</b> idée(s) touchent les deux lignes ${S.sugg?"(jalons suggérés compris)":"(base seule)"}. Exemples : l'émancipation des femmes (Seneca Falls 1848, grève du 8 mars 1917 à Petrograd), l'internationalisme prolétarien (Adresse de l'AIT à Lincoln, 1er Mai, Zimmerwald), la grève de masse (1905 en Russie, Seattle 1919), le bolchevisme lui-même (Octobre, puis fondation du PC américain, intervention alliée, raids Palmer).</p>
  <p>La ligne Bolchevisme s'arrête en 1917 : le trotskisme américain (Cannon, Minneapolis 1934, loi Smith) ne s'y rattache que par les idées <i>trotskisme</i> et <i>bolchevisme</i>. C'est un argument pour la timeline « Communisme » envisagée, dont le bolchevisme deviendrait une sous-timeline.</p>

  <h3>Questions que le prototype pose à la spécification (specs/ideas.md)</h3>
  <ol class="q">
   <li><b>Une étape « répression » ?</b> La liste des étapes ne couvre pas la réaction hostile de l'État (raids contre les IWW, raids Palmer, loi Smith, intervention de 1918). <code>critique</code> désigne une critique intellectuelle. Le prototype affiche une étape <code>repression</code> (▼) pour en juger.</li>
   <li><b>Jalons indirects par l'œuvre.</b> Quand un jalon cite une œuvre et qu'un évènement cite la même œuvre (<code>works</code> du nœud : Seneca Falls → Déclaration des sentiments, Que faire ?, Thèses d'avril), le fil se calcule tout seul (tirets). À garder comme règle du visualiseur plutôt que de dupliquer <code>node</code> dans le jalon ?</li>
   <li><b>Fin de vie d'une idée.</b> La ligne s'arrête au dernier jalon, ce qui fait « mourir » le marxisme en 1891. Le prototype prolonge en pointillé sauf après un <code>abandonment</code>. Faut-il un champ <code>active</code> / <code>end</code>, ou laisser le dernier jalon décider ?</li>
   <li><b>Géographie des jalons.</b> Les jalons portés par une seule œuvre n'ont pas de pays (colonne « Sans évènement » de la matrice, la plus remplie). Ajouter un lieu facultatif au jalon, ou dériver le pays du lieu de publication de l'œuvre ?</li>
   <li><b>Ligne vs racine.</b> La ligne Bolchevisme se remplit surtout par des nœuds de <code>russia</code> en parent secondaire, alors que la matrice raisonne par racine principale. Choisir une règle unique pour « cette idée dans ce pays ».</li>
   <li><b>Densité.</b> Avec les 55 idées affichées, la frise devient haute. Un filtre « idées touchant les lignes affichées » (par défaut ici) et un tri par arbre suffisent-ils, ou faut-il une importance par idée, comme pour les évènements ?</li>
   <li><b>Couleur.</b> Le prototype colore par tradition et code l'étape par la forme. L'inverse (couleur = étape) se lit mieux pour une seule idée, moins bien pour comparer des courants.</li>
   <li><b>Organisations porteuses.</b> Un courant (bolchevisme) et son parti (bolcheviks) sont séparés, comme prévu. La fiche idée pourrait lister les organisations citées dans ses jalons <code>adoption</code> : c'est déjà calculable.</li>
  </ol>`;
}

const side=document.getElementById("side");
const INTEG = {
  1:[["y","Frise bureau","groupe de lignes « Idées » sous les pays"],["m","Mobile","une idée en colonne secondaire"],["y","Viewer Idées","vue de départ"]],
  2:[["m","Frise bureau","tri « arbre » du groupe Idées"],["n","Mobile","trop large"],["y","Viewer Idées","cœur du viewer"]],
  3:[["m","Frise bureau","= vue « lignes de vie » prévue"],["n","Mobile","liste dans la fiche personne"],["y","Viewer Idées",""]],
  4:[["n","Frise bureau",""],["n","Mobile",""],["y","Viewer Idées","et outil de complétude"]],
};
const integBox=v=>INTEG[v]?`<h3>Intégration</h3><div class="integ">${INTEG[v].map(([c,a,b])=>`<div><span class="v ${c}">${{y:"✓",m:"~",n:"✗"}[c]}</span><b>${a}</b><span>${b}</span></div>`).join("")}</div>`:"";
const stageLegend=()=>`<div class="legend">${Object.entries(STAGES).map(([k,s])=>`${legendSvg(s.g,"#555")}<span>${s.l}${s.proposed?" <i>(proposée)</i>":""}</span>`).join("")}${legendSvg("triUp","#555",true)}<span>Jalon suggéré, hors base</span></div>`;
const tradLegend=()=>Object.entries(TRAD).filter(([k])=>IDEAS.some(d=>(d.tr||"other")===k)).map(([k,t])=>`<div class="tr-row ${S.tradOff.has(k)?"off":""}" data-tr="${k}"><span class="sw" style="background:${t.c}"></span>${t.l} <span class="hint">(${IDEAS.filter(d=>(d.tr||"other")===k).length})</span></div>`).join("");
const seg=(name,opts,cur)=>`<div class="seg">${opts.map(([v,l])=>`<button class="btn ${cur===v?"on":""}" data-opt="${name}" data-val="${v}">${l}</button>`).join("")}</div>`;
function buildSide(){
  let h="";
  if (S.view===1){
    const bridges=IDEAS.filter(d=>{ const s=ideaLanes(d); return s.has("us")&&s.has("bo"); });
    const one=k=>IDEAS.filter(d=>{ const s=ideaLanes(d); return s.has(k)&&s.size===1; }).length;
    h=`<h3>Frise &amp; idées</h3><div class="hint">Les deux lignes pays en haut, une ligne par idée en dessous. Survol d'une idée : ses évènements s'éclairent et les <b>fils</b> descendent vers eux. Molette : zoom · glisser : déplacer.</div>
      <div class="seg" style="margin-top:8px"><button class="btn" data-range="1840,1990">1840–1990</button><button class="btn" data-range="1895,1925">1895–1925</button><button class="btn" data-range="1775,2026">Tout</button></div>
      <h3>Idées affichées</h3>${seg("filter",[["touch","touchant les 2 lignes"],["all","toutes (55)"]],S.filter)}
      <h3>Regrouper par</h3>${seg("group",[["tradition","tradition"],["type","type"],["tree","arbre"]],S.group)}
      <h3>Fils jalon → évènement</h3>${seg("threads",[["sel","au survol / sélection"],["all","tous"],["none","aucun"]],S.threads)}
      <label class="chk"><input type="checkbox" data-chk="sugg" ${S.sugg?"checked":""}> Jalons suggérés (${SUGG.length}, hors base)</label>
      <label class="chk"><input type="checkbox" data-chk="links" ${S.links?"checked":""}> Liens entre évènements</label>
      <h3>Ponts États-Unis ↔ Bolchevisme (${bridges.length})</h3>
      ${bridges.map(d=>`<div class="bridge" data-k="idea" data-id="${d.id}"><span class="sw" style="display:inline-block;background:${tradOf(d).c};margin-right:6px"></span>${esc(d.nm)}<div class="m">${milestones(d).filter(m=>targets(m).length).map(m=>yearTxt(m.y)).join(" · ")}</div></div>`).join("")||'<div class="hint">Aucun avec la base seule.</div>'}
      <div class="hint" style="margin-top:6px">Une seule ligne : États-Unis ${one("us")} · Bolchevisme ${one("bo")}</div>
      <h3>Étapes (forme)</h3>${stageLegend()}
      <h3>Traditions (couleur, clic pour masquer)</h3>${tradLegend()}
      <h3>Évènements</h3><div class="hint">Formes de la frise actuelle (▲ luttes, ◆ guerres et violences, ▼ crises, ■ État, ● organisations). Cercle de couleur autour : l'évènement est un jalon d'idée.</div>
      ${integBox(1)}`;
  } else if (S.view===2){
    h=`<h3>Courants</h3><div class="hint">L'arbre <b>broader</b> mis en temps : chaque idée naît à son premier jalon et se détache de l'idée plus générale. Pointillé à droite : l'idée vit encore (pas d'abandon). Branche en tirets : second parent (Nouvelle démocratie ← maoïsme et théorie des étapes).</div>
      <h3>Afficher</h3>${seg("curOnly",[["0","toutes les idées"],["1","courants seulement"]],S.curOnly?"1":"0")}
      <h3>Traditions</h3>${tradLegend()}<h3>Étapes</h3>${stageLegend()}${integBox(2)}`;
  } else if (S.view===3){
    h=`<h3>Penseurs &amp; œuvres</h3><div class="hint">Une barre de vie par personne citée dans un jalon ou autrice d'une œuvre-jalon. ■ œuvre qui porte une idée (couleur de la tradition), tirets : rédaction → publication (<i>L'Idéologie allemande</i>, <i>Manuscrits de 1844</i>, <i>Grundrisse</i>…). Glyphes d'étape : jalons sans œuvre (discours, vote, congrès). Bande plus claire : de 20 à 60 ans.</div>
      <h3>Filtrer par tradition</h3>${Object.entries(TRAD).filter(([k])=>IDEAS.some(d=>(d.tr||"other")===k)).map(([k,t])=>`<div class="tr-row ${S.v3trad.size&&!S.v3trad.has(k)?"off":""}" data-tr3="${k}"><span class="sw" style="background:${t.c}"></span>${t.l}</div>`).join("")}
      <div class="hint" style="margin-top:4px">Clic : n'afficher que cette tradition (cumulable).</div>${integBox(3)}`;
  } else if (S.view===4){
    h=`<h3>Idées × pays</h3><div class="hint">Où chaque idée a été <b>mise à l'épreuve</b>, adoptée ou combattue. Les colonnes États-Unis (bleu) et Bolchevisme / Russie (rouge) sont teintées.</div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" data-chk="sugg" ${S.sugg?"checked":""}> Jalons suggérés</label>${integBox(4)}`;
  } else {
    h=`<h3>Bilan</h3><div class="hint">Synthèse des possibilités d'intégration et questions ouvertes pour la spécification des idées.</div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" data-chk="sugg" ${S.sugg?"checked":""}> Compter les jalons suggérés</label>`;
  }
  side.innerHTML=h;
}
side.addEventListener("click",e=>{
  const o=e.target.closest("[data-opt]"); if(o){ const k=o.dataset.opt; S[k]=k==="curOnly"?o.dataset.val==="1":o.dataset.val; buildSide(); renderCurrent(); return; }
  const r=e.target.closest("[data-range]"); if(r){ const [a,b]=r.dataset.range.split(",").map(Number); S.t0=a; S.t1=b; renderCurrent(); return; }
  const t=e.target.closest("[data-tr]"); if(t){ const k=t.dataset.tr; S.tradOff.has(k)?S.tradOff.delete(k):S.tradOff.add(k); buildSide(); renderCurrent(); return; }
  const t3=e.target.closest("[data-tr3]"); if(t3){ const k=t3.dataset.tr3; S.v3trad.has(k)?S.v3trad.delete(k):S.v3trad.add(k); buildSide(); renderCurrent(); return; }
  const b=e.target.closest(".bridge"); if(b){ openDetail("idea",b.dataset.id); revealIdea(b.dataset.id); }
});
side.addEventListener("change",e=>{ const c=e.target.dataset.chk; if(c){ S[c]=e.target.checked; buildSide(); renderCurrent(); if(S.sel&&S.sel.kind) openDetail(S.sel.kind,S.sel.id); } });

// ───────────────────────── navigation ─────────────────────────
function renderCurrent(){ [null,renderV1,renderV2,renderV3,renderV4,renderV5][S.view](); }
function setView(v){ S.view=v; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",+b.dataset.v===v)); document.querySelectorAll(".view").forEach(el=>el.classList.toggle("on",el.id==="v"+v)); buildSide(); renderCurrent(); }
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ det.classList.remove("open"); S.sel=null; hideTip(); setView(+b.dataset.v); } });
addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });
addEventListener("resize",()=>renderCurrent());
setView(1);
</script>
