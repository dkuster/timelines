# Vérifie la base et le code à chaque push ou pull request ; publie le site sur GitHub Pages à chaque push sur main.
name: Vérification et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Validation de la base
        run: python -m tldb validate --quiet
      - name: Format canonique
        run: python -m tldb format --check
      - name: Tests
        run: python -m pytest -q
      - name: Lint du code des pages
        run: npm run lint
      - name: Build du site
        run: python -m tldb build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
